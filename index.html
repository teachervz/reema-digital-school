<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة الدروس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F1E8; --paper2:#EFE7DA; --ink:#2A2420; --ink2:#5E544C; --ink3:#968A7F; --rule:#DDD2C2;
  --design:#C8553D; --design-d:#9C3A26; --design-l:#F5DCD3;
  --tech:#1F5F6B;   --tech-d:#143F48;   --tech-l:#D3E6E8;
  --gold:#C99A2E; --ok:#3D7A4E; --ok-l:#DCEBDF; --warn:#B7791F; --warn-l:#F7E8CC; --bad:#B23A3A; --bad-l:#F4D9D6;
  --display:'Tajawal','Segoe UI',Tahoma,sans-serif;
  --font:'Tajawal','Segoe UI',Tahoma,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--paper);color:var(--ink);min-height:100vh;line-height:1.6}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}

/* ===== الترويسة ===== */
header{border-bottom:1px solid var(--rule);background:var(--paper)}
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:34px 0 18px;flex-wrap:wrap}
.eyebrow{font-size:13px;letter-spacing:.5px;color:var(--ink3);font-weight:600}
.mast h1{font-family:var(--display);font-weight:800;font-size:40px;margin:2px 0 0;line-height:1.2}
.mast .school{color:var(--ink2);font-size:16px}
.tabs{display:flex;gap:4px;margin-top:6px}
.tab{border:0;background:none;padding:10px 4px;margin-inline-end:22px;cursor:pointer;font-weight:600;color:var(--ink3);border-bottom:2.5px solid transparent;font-size:16px}
.tab.on{color:var(--ink);border-color:var(--ink)}
.iconbtn{border:1px solid var(--rule);background:#fff8;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--ink2)}
.iconbtn:hover{background:#fff}

main.wrap{padding-top:34px;padding-bottom:80px}
.view{display:none}.view.on{display:block}

/* ===== الرفوف ===== */
.shelf{margin-bottom:48px}
.shelf-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.shelf-head h2{font-family:var(--display);font-size:28px;margin:0;font-weight:800}
.shelf-head .unit{color:var(--ink2);font-size:15px}
.shelf-head .count{margin-inline-start:auto;color:var(--ink3);font-size:14px}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:26px 22px;padding:22px 0 20px;border-bottom:10px solid var(--paper2);box-shadow:0 12px 0 -6px var(--rule);position:relative}
.book{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:10px}
.cover{aspect-ratio:3/4;border-radius:4px 10px 10px 4px;position:relative;overflow:hidden;color:#fff;padding:18px 18px 16px 22px;display:flex;flex-direction:column;
  box-shadow:inset 7px 0 0 rgba(0,0,0,.18),inset 9px 0 0 rgba(255,255,255,.12),0 10px 22px -10px rgba(42,36,32,.55);transition:transform .2s ease,box-shadow .2s ease}
.book:hover .cover,.book:focus-visible .cover{transform:translateY(-6px) rotate(-.6deg);box-shadow:inset 7px 0 0 rgba(0,0,0,.18),inset 9px 0 0 rgba(255,255,255,.12),0 20px 30px -12px rgba(42,36,32,.6)}
.book:focus-visible .cover{outline:3px solid var(--gold);outline-offset:3px}
.s-design .cover{background:linear-gradient(160deg,var(--design),var(--design-d))}
.s-tech .cover{background:linear-gradient(160deg,var(--tech),var(--tech-d))}
.cover .no{font-family:var(--display);font-size:13px;opacity:.85}
.cover .big{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;opacity:.3;position:absolute;top:12px;left:16px}
.cover .ttl{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.45;margin-top:auto;position:relative}
.cover .orn{position:absolute;top:14px;left:14px;width:34px;height:34px;border:1.5px solid rgba(255,255,255,.45);border-radius:50%}
.cover.project{background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 10px,transparent 10px 20px),linear-gradient(160deg,#5B4A3F,#3A2F28)!important}
.meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600}
.pill.wip{background:var(--warn-l);color:var(--warn)}
.pill.ready{background:var(--ok-l);color:var(--ok)}
.pill.wip::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}

/* ===== صفحة الدرس ===== */
.back{all:unset;cursor:pointer;color:var(--ink2);font-weight:600;font-size:15px;display:inline-flex;gap:6px;margin-bottom:22px}
.back:hover{color:var(--ink)}
.lesson{display:grid;grid-template-columns:260px 1fr;gap:44px;align-items:start}
.lesson .cover{width:100%;position:sticky;top:24px}
.lesson h2{font-family:var(--display);font-weight:800;font-size:34px;margin:0;line-height:1.3}
.lesson .sub{color:var(--ink2);margin:4px 0 16px}
.notice{background:var(--warn-l);color:#7A5212;border-radius:12px;padding:12px 16px;font-size:14.5px;margin-bottom:26px;display:flex;gap:10px;align-items:flex-start}
.step{border-top:1px solid var(--rule);padding:22px 0}
.step h3{margin:0 0 4px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.step h3 .n{font-family:var(--display);width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);display:inline-grid;place-items:center;font-size:14px}
.step .hint{color:var(--ink3);font-size:13.5px;margin:0 0 14px}
.choices{display:flex;flex-wrap:wrap;gap:10px}
.choice{border:1.5px solid var(--rule);background:#fffaf2;border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:15px;transition:.15s}
.choice:hover{border-color:var(--ink3)}
.choice.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.choice small{display:block;font-weight:400;font-size:12.5px;opacity:.75}
.names{display:flex;flex-wrap:wrap;gap:7px}
.nm{border:1px solid var(--rule);background:#fffaf2;border-radius:99px;padding:4px 12px;font-size:13.5px;cursor:pointer;user-select:none}
.nm.off{opacity:.45;text-decoration:line-through;background:transparent}
.btn{border:0;border-radius:12px;padding:11px 20px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--paper);font-size:15px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.soft{background:var(--paper2);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn.danger{background:var(--bad-l);color:var(--bad)}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--rule);padding-top:22px}

/* المجموعات */
.gtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input[type=text],input[type=number],select{border:1.5px solid var(--rule);border-radius:10px;padding:7px 11px;background:#fffaf2;outline:none}
input:focus,select:focus{border-color:var(--ink2)}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.g{background:#fffaf2;border:1px solid var(--rule);border-radius:12px;padding:10px 12px;border-top:5px solid var(--c)}
.g.over{outline:2px dashed var(--ink2)}
.g .gh{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.g .gh input{flex:1;border:0;background:none;font-weight:700;padding:2px;font-size:15px}
.g .x{border:0;background:none;cursor:pointer;color:var(--ink3);font-size:16px}
.m{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:13.5px;border-bottom:1px dashed var(--rule);cursor:grab}
.m:last-child{border:0}
.m select{margin-inline-start:auto;font-size:12px;padding:1px 4px;border-radius:6px;background:transparent}
.loose{margin-top:12px;padding:10px;border:1.5px dashed var(--rule);border-radius:12px;min-height:44px}
.loose.over{border-color:var(--ink2)}

/* ===== الفصول ===== */
.classbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.seg{display:inline-flex;border:1.5px solid var(--rule);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 16px;cursor:pointer;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--paper)}
.tw{overflow:auto;border:1px solid var(--rule);border-radius:12px;max-height:70vh;background:#fffaf2}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--paper2);z-index:2;font-size:12.5px;line-height:1.4;color:var(--ink2);font-weight:600}
thead tr:nth-child(2) th{top:33px}
th.grp{font-weight:700;color:var(--ink)}
td.who{text-align:right;font-weight:600;position:sticky;right:0;background:#fffaf2;z-index:1;max-width:300px;overflow:hidden;text-overflow:ellipsis}
th.who{position:sticky;right:0;z-index:3}
td input.gr{width:46px;text-align:center;padding:4px 2px;border-radius:7px;border:1px solid transparent;background:transparent}
td input.gr:hover,td input.gr:focus{border-color:var(--rule);background:#fff}
td input.gr.bad{border-color:var(--bad);background:var(--bad-l)}
td.sum{font-weight:700;background:#f8f1e4}
td.tot{font-weight:700;font-size:15px}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600}
.t-ex{background:var(--ok-l);color:var(--ok)}.t-vg{background:var(--tech-l);color:var(--tech)}.t-g{background:var(--warn-l);color:var(--warn)}.t-p{background:var(--design-l);color:var(--design-d)}.t-f{background:var(--bad-l);color:var(--bad)}.t-na{color:var(--ink3)}

/* ===== نوافذ ===== */
dialog{border:0;border-radius:18px;padding:0;max-width:560px;width:calc(100% - 32px);background:var(--paper);color:var(--ink);box-shadow:0 30px 60px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(42,36,32,.55)}
.dlg{padding:26px 28px}
.dlg h3{font-family:var(--display);margin:0 0 16px;font-size:24px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;font-weight:600;font-size:14px}
.field input{font-weight:400}
.dlg .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:8px}
/* القرعة */
#drawDlg{max-width:760px}
.drawstage{background:var(--ink);color:var(--paper);border-radius:14px;min-height:240px;display:grid;place-items:center;text-align:center;padding:26px;margin-bottom:16px}
.drawstage .who{font-family:var(--display);font-size:clamp(30px,6vw,54px);line-height:1.3}
.drawstage .who.spin{opacity:.55}
.drawstage .who.win{animation:pop .5s cubic-bezier(.2,1.6,.4,1);color:var(--gold)}
.drawstage .full{opacity:.75;font-size:15px;margin-top:6px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,120px);background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:12px;font-weight:600;transition:transform .3s;z-index:99}
.toast.show{transform:translate(-50%,0)}
.empty{color:var(--ink3);padding:14px 0}
/* التقدم والتحضير */
.prog{display:flex;flex-direction:column;gap:10px}
.prow{display:grid;grid-template-columns:130px 1fr auto;gap:14px;align-items:center;background:#fffaf2;border:1px solid var(--rule);border-radius:12px;padding:10px 14px}
.prow b{font-size:15px}
.prow .bar{height:10px;border-radius:99px;background:var(--paper2);overflow:hidden}
.prow .bar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.prow small{display:block;color:var(--ink3);font-size:12.5px;margin-top:4px}
.prow.cur{border-color:var(--ink2)}
.minibar{flex:1;height:6px;border-radius:99px;background:var(--rule);overflow:hidden;min-width:40px}
.minibar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.prepbox{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#fffaf2;border:1px dashed var(--rule);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:14px;color:var(--ink2)}
@media (max-width:600px){.prow{grid-template-columns:1fr}}

@media (max-width:820px){
  .wrap{padding:0 16px}
  .mast h1{font-size:30px}
  .lesson{grid-template-columns:1fr;gap:20px}
  .lesson .cover{position:static;max-width:200px}
  .books{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:20px 14px}
  .cover .ttl{font-size:16px}
}
@media print{header,.classbar,.noprint{display:none!important}.tw{max-height:none;overflow:visible}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="mast">
      <div>
        <div class="eyebrow">مكتبة الدروس</div>
        <h1 id="hTeacher"></h1>
        <div class="school" id="hSchool"></div>
      </div>
      <button class="iconbtn" id="openSettings">⚙︎ الإعدادات</button>
    </div>
    <nav class="tabs">
      <button class="tab" data-r="library">الدروس</button>
      <button class="tab" data-r="classes">الفصول والطالبات</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-library"></section>
  <section class="view" id="v-lesson"></section>
  <section class="view" id="v-classes"></section>
</main>

<!-- الإعدادات -->
<dialog id="setDlg"><form class="dlg" method="dialog">
  <h3>الإعدادات</h3>
  <label class="field">اسم المعلمة<input type="text" id="sTeacher"></label>
  <label class="field">اسم المدرسة<input type="text" id="sSchool"></label>
  <label class="field">العام الدراسي<input type="text" id="sYear"></label>
  <div class="field">النسخ الاحتياطي
    <div style="display:flex;gap:8px;flex-wrap:wrap;font-weight:400">
      <button type="button" class="btn soft sm" id="backup">تصدير نسخة</button>
      <label class="btn soft sm" style="cursor:pointer">استيراد نسخة<input type="file" id="restore" accept=".json" hidden></label>
      <button type="button" class="btn danger sm" id="factory">استعادة بيانات الإكسل الأصلية</button>
    </div>
  </div>
  <div class="row"><button class="btn">تم</button></div>
</form></dialog>

<!-- القرعة -->
<dialog id="drawDlg"><div class="dlg">
  <h3 id="drawTitle">قرعة</h3>
  <div class="drawstage"><div><div class="who" id="drawWho">؟</div><div class="full" id="drawFull"></div></div></div>
  <div class="row" style="justify-content:space-between;align-items:center">
    <label style="font-size:14px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="noRepeat" checked> بدون تكرار</label>
    <div style="display:flex;gap:8px">
      <button class="btn soft" onclick="drawDlg.close()">إغلاق</button>
      <button class="btn" id="drawGo">اسحبي</button>
    </div>
  </div>
</div></dialog>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   📚 قائمة الدروس — عند تجهيز درس: ضعي مسار ملفه في path وغيّري status إلى 'ready'
   ===================================================================== */
const LIBRARY = [
  { id:'design', name:'التصميم الرقمي', unit:'الفصل السادس — تصميم واجهات الموقع الإلكتروني · الفصل السابع — تصميم الشخصيات · الفصل الثامن — الموشن جرافيك', lessons:[
    { id:'dd-1', no:'الدرس الأول',  title:'ماهية تصميم واجهة المستخدم UI وتجربة المستخدم UX', path:'digital-design/index.html', status:'ready' },
    { id:'dd-2', no:'الدرس الثاني', title:'الخطوات الإجرائية لتصميم واجهات الموقع الإلكتروني', path:'digital-design/lesson2.html', status:'ready' },
    { id:'dd-3', no:'الدرس الثالث', title:'رسم المخططات الهيكلية WireFrames', path:'digital-design/lesson3.html', status:'ready' },
    { id:'dd-4', no:'الدرس الرابع', title:'الخطوات الإجرائية للتصميم المرئي', path:'digital-design/lesson4.html', status:'ready' },
    { id:'dd-5', no:'الفصل السابع · 7-1', title:'مجالات تصميم الشخصيات', path:'digital-design/lesson5.html', status:'ready', mark:'7-1' },
    { id:'dd-6', no:'الفصل السابع · 7-2', title:'الخطوات الإجرائية لرسم وتصميم الشخصيات', path:'digital-design/lesson6.html', status:'ready', mark:'7-2' },
    { id:'dd-7', no:'الفصل السابع · 7-3', title:'برامج وتطبيقات الرسم والتصميم الرقمي', path:'digital-design/lesson7.html', status:'ready', mark:'7-3' },
    { id:'dd-8', no:'الفصل الثامن · 8-1', title:'أهمية الموشن جرافيك (تحريك الرسومات)', path:'digital-design/lesson8.html', status:'ready', mark:'8-1' },
    { id:'dd-9', no:'الفصل الثامن · 8-2', title:'أنواع ومجالات الموشن جرافيك', path:'digital-design/lesson9.html', status:'ready', mark:'8-2' },
    { id:'dd-10', no:'الفصل الثامن · 8-3', title:'خطوات تصميم فيديو موشن جرافيك', path:'digital-design/lesson10.html', status:'ready', mark:'8-3' },
  ]},
  { id:'tech', name:'التقنية الرقمية', unit:'الوحدة الثانية', lessons:[
    { id:'dt-1', no:'الدرس الأول', title:'مقدمة عن تطبيقات الهواتف الذكية', path:'digital-tech/chapter2/index.html', status:'ready' },
    { id:'dt-r', no:'مراجعة الوحدة', title:'مراجعة الدروس ومحاكي مشروع الوحدة', path:'digital-tech/review/index.html', status:'ready', mark:'↻' },
  ]},
];

/* درجات كل مادة كما في دفتر الرصد */
const GRADEBOOK = {
  design:[
    {name:'الجانب المعرفي',max:50,items:[['ملف الإنجاز',10],['الواجبات الإلكترونية',10],['اختبار فتري',10],['اختبار نهائي',20]]},
    {name:'الجانب المهاري',max:50,items:[['مهارات الاتصال والتشارك',10],['مهارات القيادة والمسؤولية',10],['مهارات إدارة الوقت',10],['المهارات الرقمية',10],['تقديم العرض الختامي',10]]}
  ],
  tech:[
    {name:'المهام الأدائية والمشاركة والتفاعل',max:40,items:[['الحضور',5],['الواجبات الإلكترونية',5],['الاختبار الإلكتروني',5],['تطبيقات عملية',10],['مشاركة صفية',10],['الواجبات الورقية',5]]},
    {name:'تقويمات تحريرية وتطبيقات عملية',max:60,items:[['اختبار تحريري',30],['تطبيقات عملية',30]]}
  ]

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

function route(){
  const h=location.hash.replace(/^#\/?/,'').split('/');
  const r=h[0]||'library';
  $$('.view').forEach(v=>v.classList.remove('on'));
  $$('.tab').forEach(t=>t.classList.toggle('on',t.dataset.r===(r==='lesson'?'library':r)));
  $('#hTeacher').textContent='أ. '+S.settings.teacher;
  $('#hSchool').textContent=S.settings.school+(S.settings.year?' · '+S.settings.year:'');
  if(r==='lesson'&&findLesson(h[1])){renderLesson(h[1]);$('#v-lesson').classList.add('on')}
  else if(r==='classes'){renderClasses();$('#v-classes').classList.add('on')}
  else{renderLibrary();$('#v-library').classList.add('on')}
}
$$('.tab').forEach(t=>t.onclick=()=>location.hash='#/'+t.dataset.r);
addEventListener('hashchange',()=>{route();scrollTo(0,0)});

  $('#v-library').innerHTML=LIBRARY.map(s=>`
    <div class="shelf s-${s.id}">
      <div class="shelf-head"><h2>${esc(s.name)}</h2><span class="unit">${esc(s.unit)}</span><span class="count">${s.lessons.filter(l=>l.status==='ready').length} من ${s.lessons.length} جاهزة</span></div>
      <div class="books">${s.lessons.map(l=>{const c=S.lessonCfg[l.id];return`
        <button class="book" onclick="location.hash='#/lesson/${l.id}'">
          ${coverHTML(s,l)}
          <div class="meta">${statusPill(l)}${c?`<span>${esc(classById(c.classId).name)}</span>`:''}${(()=>{const p=c&&progFor(l.id,c.classId);return p?`<span class="minibar" title="وصلتِ للشريحة ${p.slide+1} من ${p.total}"><i style="width:${progPct(p)}%"></i></span>`:''})()}</div>
        </button>`}).join('')}</div>
    </div>`).join('');
}

/* ===== صفحة الدرس ===== */
function renderLesson(id){
  const {subject:s,lesson:l}=findLesson(id), cfg=cfgOf(id), c=classById(cfg.classId);
  const ab=S.absent[c.id]||[], gs=S.groups[c.id]||[];
  const needGroups=cfg.drawMode==='groups'||cfg.compMode==='groups';
  let n=1;
  $('#v-lesson').innerHTML=`
    <button class="back" onclick="location.hash='#/library'">→ المكتبة</button>
    <div class="lesson s-${s.id}">
      <div>${coverHTML(s,l)}</div>
      <div>
        <div class="eyebrow">${esc(s.name)} · ${esc(s.unit)}</div>
        <h2>${esc(l.title)}</h2>
        <div class="sub">${esc(l.no)} &nbsp;${statusPill(l)}</div>
        ${l.status!=='ready'?`<div class="notice">⏳ <span>هذا الدرس قيد الإعداد. تقدرين تجهّزين إعداداته الآن (الفصل، القرعة، نوع المنافسة، المجموعات) وتنحفظ له، وتشتغل أول ما يجهز.</span></div>`:''}

        <div class="step"><h3><span class="n">${n++}</span>الفصل</h3>
          <p class="hint">اختاري الفصل اللي بتقدمين له الدرس</p>
          <div class="choices">${S.classes.map(k=>`<button class="choice ${k.id===c.id?'on':''}" data-cls="${k.id}">${esc(k.name)}<small>${k.students.length} طالبة</small></button>`).join('')}</div>
        </div>

        <div class="step"><h3><span class="n">${n++}</span>الحاضرات</h3>
          <p class="hint">اضغطي على اسم الغائبة لاستبعادها من القرعة — الحاضرات: <b>${c.students.length-ab.length}</b> من ${c.students.length}</p>
          <div class="names">${c.students.map(st=>`<span class="nm ${ab.includes(st.id)?'off':''}" data-abs="${st.id}" title="${esc(st.name)}">${esc(short(st.name))}</span>`).join('')}</div>
        </div>

        <div class="step"><h3><span class="n">${n++}</span>طريقة اختيار المشاركات</h3>
          <div class="choices">${Object.entries(DRAW_LABEL).map(([k,v])=>`<button class="choice ${cfg.drawMode===k?'on':''}" data-draw="${k}">${v}</button>`).join('')}</div>
        </div>

        <div class="step"><h3><span class="n">${n++}</span>نوع الدرس</h3>
          <div class="choices">${Object.entries(COMP_LABEL).map(([k,v])=>`<button class="choice ${cfg.compMode===k?'on':''}" data-comp="${k}">${v}</button>`).join('')}</div>
        </div>

        <div class="step"><h3><span class="n">${n++}</span>مجموعات ${esc(c.name)}</h3>
          <p class="hint">${needGroups?'هذا الدرس يحتاج مجموعات — المجموعات محفوظة للفصل وتُستخدم في كل الدروس':'اختياري — المجموعات محفوظة للفصل وتُستخدم في كل الدروس'}</p>
          <div class="gtools">
            <select id="gBy"><option value="count">عدد المجموعات</option><option value="size">طالبات في كل مجموعة</option></select>
            <input type="number" id="gN" value="${gs.length||4}" min="1" max="30" style="width:70px">
            <select id="gHow"><option value="random">عشوائي</option><option value="balanced">متوازن حسب درجات ${esc(s.name)}</option></select>
            <button class="btn sm" id="gAuto">كوّني</button>
            <button class="btn soft sm" id="gAdd">＋ مجموعة</button>
            ${gs.length?'<button class="btn danger sm" id="gClear">حذف الكل</button>':''}
          </div>
          <div id="gBox"></div>
        </div>

        ${l.path?`<div class="step"><h3><span class="n">${n++}</span>تتبّع الدرس والتحضير</h3>
          <p class="hint">يُحفظ تلقائيًا أين وصلتِ مع كل فصل، وعند فتح العرض يسألكِ إن كنتِ تريدين الإكمال من آخر شريحة</p>
          <div class="prog">${S.classes.map(k=>{const p=progFor(l.id,k.id),pc=progPct(p);return `<div class="prow ${k.id===c.id?'cur':''}"><b>${esc(k.name)}</b>
            <div><div class="bar"><i style="width:${pc}%"></i></div><small>${p?`${p.done?'✅ اكتمل · ':''}آخر شريحة: ${p.slide+1} من ${p.total} «${esc(p.title||'')}» · عُرضت ${(p.visited||[]).length} شريحة · ${ago(p.updated)}`:'لم يبدأ بعد'}</small></div>
            <div>${p?`<button class="btn soft sm" data-reset="${k.id}">تصفير</button>`:''}</div></div>`}).join('')}</div>
          <div class="prepbox">📝 <span>${prepCount(l.id)?`تحضير معدّل ومحفوظ لـ <b>${prepCount(l.id)}</b> شريحة`:'التحضير الافتراضي جاهز لكل شريحة — عدّليه من زر 📝 داخل العرض'}</span><span style="flex:1"></span>
            <a class="btn soft sm" href="${l.path}#print" target="_blank" style="text-decoration:none">🖨️ عرض وطباعة التحضير</a></div>
        </div>`:''}

        <div class="actions">
          <button class="btn" id="startLesson" ${l.status==='ready'&&l.path?'':'disabled'}>ابدئي الدرس ←</button>
          ${cfg.drawMode!=='none'?`<button class="btn line" id="quickDraw">${DRAW_LABEL[cfg.drawMode]} الآن</button>`:''}
          ${l.status!=='ready'&&l.path?`<a class="btn soft" href="${l.path}" target="_blank" style="text-decoration:none">معاينة المسودة</a>`:''}
        </div>
      </div>
    </div>`;
  const set=(k,v)=>{cfg[k]=v;save();renderLesson(id)};
  $$('[data-cls]').forEach(b=>b.onclick=()=>set('classId',b.dataset.cls));
  $$('[data-draw]').forEach(b=>b.onclick=()=>set('drawMode',b.dataset.draw));
  $$('[data-comp]').forEach(b=>b.onclick=()=>set('compMode',b.dataset.comp));
  $$('[data-abs]').forEach(b=>b.onclick=()=>{const L=S.absent[c.id]=S.absent[c.id]||[];const i=L.indexOf(b.dataset.abs);i<0?L.push(b.dataset.abs):L.splice(i,1);save();renderLesson(id)});
  renderGroups(c,s.id,()=>renderLesson(id));
  $('#gAuto').onclick=()=>autoGroups(c,s.id,()=>renderLesson(id));
  $('#gAdd').onclick=()=>{const g=S.groups[c.id]=S.groups[c.id]||[];g.push(newGroup(g.length));save();renderLesson(id)};
  $('#gClear')&&($('#gClear').onclick=()=>{if(confirm('حذف كل مجموعات '+c.name+'؟')){S.groups[c.id]=[];save();renderLesson(id)}});
  $('#quickDraw')&&($('#quickDraw').onclick=()=>openDraw(c,cfg.drawMode));
  $('#startLesson').onclick=()=>{publishLesson(l,s,c,cfg);location.href=l.path};
  $$('[data-reset]').forEach(b=>b.onclick=()=>{if(!confirm('تصفير تتبّع هذا الدرس لـ '+classById(b.dataset.reset).name+'؟'))return;const all=readKey(PROG_KEY);if(all[l.id])delete all[l.id][b.dataset.reset];try{localStorage.setItem(PROG_KEY,JSON.stringify(all))}catch(e){}renderLesson(id)});
}

/* بيانات الدرس الحالية لصفحة الدرس */
function publishLesson(l,s,c,cfg){
  const ab=S.absent[c.id]||[];
  try{localStorage.setItem('reema-lesson',JSON.stringify({
    lessonId:l.id,lessonNo:l.no,title:l.title,subject:s.name,classId:c.id,teacher:'أ. '+S.settings.teacher,school:S.settings.school,
    className:c.name,drawMode:cfg.drawMode,compMode:cfg.compMode,
    students:c.students.filter(x=>!ab.includes(x.id)).map(x=>({id:x.id,name:x.name,short:short(x.name)})),
    groups:(S.groups[c.id]||[]).map(g=>({id:g.id,name:g.name,color:g.color,members:g.members.filter(m=>!ab.includes(m)).map(m=>short(nameOf(m)))}))
  }))}catch(e){}
}

/* ===== المجموعات ===== */
function newGroup(i){return{id:uid(),name:'المجموعة '+(i+1),color:GCOLORS[i%GCOLORS.length],members:[]}}
function total(sid,sub){const r=S.grades[sub][sid]||[];return r.reduce((a,v)=>a+(+v||0),0)}
function autoGroups(c,sub,done){
  const ab=S.absent[c.id]||[]; let st=c.students.filter(s=>!ab.includes(s.id));
  const n=Math.max(1,+$('#gN').value||1), count=$('#gBy').value==='count'?Math.min(n,st.length):Math.ceil(st.length/n);
  if((S.groups[c.id]||[]).length&&!confirm('ستُستبدل مجموعات '+c.name+' الحالية. متابعة؟'))return;
  const gs=Array.from({length:count},(_,i)=>newGroup(i));
  if($('#gHow').value==='balanced'){st=shuffle(st).sort((a,b)=>total(b.id,sub)-total(a.id,sub));st.forEach((s,i)=>{const r=Math.floor(i/count),k=i%count;gs[r%2?count-1-k:k].members.push(s.id)})}
  else shuffle(st).forEach((s,i)=>gs[i%count].members.push(s.id));
  S.groups[c.id]=gs;save();done();toast('تم تكوين '+count+' مجموعات');
}
function renderGroups(c,sub,done){
  const gs=S.groups[c.id]||[], opts=gs.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('');
  const inG=new Set(gs.flatMap(g=>g.members)), loose=c.students.filter(s=>!inG.has(s.id));
  $('#gBox').innerHTML=(gs.length?`<div class="gl">${gs.map(g=>`
    <div class="g" style="--c:${g.color}" data-drop="${g.id}">
      <div class="gh"><input value="${esc(g.name)}" data-rn="${g.id}"><span style="color:var(--ink3);font-size:13px">${g.members.length}</span><button class="x" data-dg="${g.id}" title="حذف">×</button></div>
      ${g.members.map(m=>`<div class="m" draggable="true" data-sid="${m}" title="${esc(nameOf(m))}">${esc(short(nameOf(m)))}<select data-mv="${m}"><option value="${g.id}">نقل</option>${opts}<option value="">بدون</option></select></div>`).join('')}
    </div>`).join('')}</div>`:'<div class="empty">لا توجد مجموعات لهذا الفصل بعد.</div>')
    +(gs.length&&loose.length?`<div class="loose names" data-drop="">${loose.map(s=>`<span class="nm m" draggable="true" data-sid="${s.id}">${esc(short(s.name))} <select data-mv="${s.id}"><option value="">إلى</option>${opts}</select></span>`).join('')}</div>`:'');
  const move=(sid,gid)=>{gs.forEach(g=>g.members=g.members.filter(m=>m!==sid));const g=gs.find(g=>g.id===gid);g&&g.members.push(sid);save();done()};
  $$('[data-mv]').forEach(s=>s.onchange=()=>move(s.dataset.mv,s.value));
  $$('[data-rn]').forEach(i=>i.onchange=()=>{gs.find(g=>g.id===i.dataset.rn).name=i.value.trim()||'مجموعة';save()});
  $$('[data-dg]').forEach(b=>b.onclick=()=>{S.groups[c.id]=gs.filter(g=>g.id!==b.dataset.dg);save();done()});
  $$('#gBox [draggable]').forEach(m=>m.ondragstart=e=>e.dataTransfer.setData('text',m.dataset.sid));
  $$('#gBox [data-drop]').forEach(z=>{z.ondragover=e=>{e.preventDefault();z.classList.add('over')};z.ondragleave=()=>z.classList.remove('over');z.ondrop=e=>{e.preventDefault();move(e.dataTransfer.getData('text'),z.dataset.drop)}});
}

/* ===== القرعة السريعة ===== */
let drawCtx=null, drawn=[];
function openDraw(c,mode){
  if(mode==='groups'&&!(S.groups[c.id]||[]).length)return toast('كوّني المجموعات أولًا');
  drawCtx={c,mode};drawn=[];
  $('#drawTitle').textContent=DRAW_LABEL[mode]+' — '+c.name;$('#drawWho').textContent='؟';$('#drawWho').className='who';$('#drawFull').textContent='';
  $('#drawDlg').showModal();
}
function drawPool(){
  const {c,mode}=drawCtx, ab=S.absent[c.id]||[];
  if(mode==='groups')return(S.groups[c.id]||[]).filter(g=>g.members.length).map(g=>({id:g.id,label:g.name,full:g.members.map(m=>short(nameOf(m))).join('، ')}));
  return c.students.filter(s=>!ab.includes(s.id)).map(s=>({id:s.id,label:short(s.name),full:s.name}));
}
$('#drawGo').onclick=()=>{
  const all=drawPool(); if(!all.length)return; let pool=all;
  if($('#noRepeat').checked){pool=all.filter(x=>!drawn.includes(x.id));if(!pool.length){drawn=[];pool=all;toast('اكتملت الدورة — من جديد')}}
  const win=pool[Math.floor(Math.random()*pool.length)], el=$('#drawWho'); el.className='who spin'; $('#drawFull').textContent='';$('#drawGo').disabled=true;
  let k=0,d=45;(function t(){el.textContent=all[Math.floor(Math.random()*all.length)].label;if(++k<24){d*=1.1;setTimeout(t,d)}else{el.textContent=win.label;el.className='who win';$('#drawFull').textContent=win.full;drawn.push(win.id);$('#drawGo').disabled=false}})();
};

/* ===== الفصول والطالبات ===== */
function grade(t,any){if(!any)return['—','t-na'];if(t>=90)return['ممتاز','t-ex'];if(t>=80)return['جيد جدًا','t-vg'];if(t>=70)return['جيد','t-g'];if(t>=50)return['مقبول','t-p'];return['ضعيف','t-f']}
function rowOf(sid,sub){const n=GRADEBOOK[sub].reduce((a,g)=>a+g.items.length,0);return S.grades[sub][sid]=S.grades[sub][sid]||Array(n).fill(null)}
function totals(sid,sub){const r=rowOf(sid,sub);let i=0,any=false;const parts=GRADEBOOK[sub].map(g=>{let t=0;g.items.forEach(()=>{const v=r[i++];if(v!=null&&v!==''){t+=+v;any=true}});return t});return{parts,total:parts.reduce((a,b)=>a+b,0),any}}
function renderClasses(){
  const c=classById(S.ui.classId), sub=S.ui.subject, gb=GRADEBOOK[sub], subjName=LIBRARY.find(x=>x.id===sub).name;
  let h=`<div class="classbar">
    <div class="seg">${S.classes.map(k=>`<button data-c="${k.id}" class="${k.id===c.id?'on':''}">${esc(k.name)}</button>`).join('')}</div>
    <div class="seg">${LIBRARY.map(x=>`<button data-s="${x.id}" class="${x.id===sub?'on':''}">${esc(x.name)}</button>`).join('')}</div>
    <span style="flex:1"></span>
    <button class="btn soft sm" id="renameClass">تعديل اسم الفصل</button>
    <button class="btn soft sm" id="addSt">＋ طالبة</button>
    <button class="btn soft sm" id="csv">تصدير Excel</button>
    <button class="btn soft sm" onclick="print()">طباعة</button>
  </div>
  <div class="tw"><table><thead><tr><th rowspan="2">م</th><th rowspan="2" class="who">اسم الطالبة</th>`;
  gb.forEach(g=>h+=`<th class="grp" colspan="${g.items.length+1}">${g.name}</th>`);
  h+=`<th rowspan="2">المجموع<br>100</th><th rowspan="2">التقدير</th><th rowspan="2" class="noprint"></th></tr><tr>`;
  gb.forEach(g=>{g.items.forEach(([n,m])=>h+=`<th>${n}<br><b>${m}</b></th>`);h+=`<th>المجموع<br><b>${g.max}</b></th>`});
  h+='</tr></thead><tbody>';
  c.students.forEach((st,ix)=>{const r=rowOf(st.id,sub),t=totals(st.id,sub),[gl,gc]=grade(t.total,t.any);let i=0;
    h+=`<tr data-sid="${st.id}"><td>${ix+1}</td><td class="who" title="${esc(st.name)}">${esc(st.name)}</td>`;
    gb.forEach((g,gi)=>{g.items.forEach(([,m])=>{h+=`<td><input class="gr" inputmode="decimal" data-i="${i}" data-max="${m}" value="${r[i]??''}"></td>`;i++});h+=`<td class="sum" data-p="${gi}">${t.parts[gi]}</td>`});
    h+=`<td class="tot">${t.any?t.total:'—'}</td><td><span class="tag ${gc}">${gl}</span></td><td class="noprint"><button class="x" style="border:0;background:none;cursor:pointer;color:var(--ink3)" data-del="${st.id}" title="حذف">×</button></td></tr>`});
  $('#v-classes').innerHTML=h+'</tbody></table></div>';
  $$('[data-c]').forEach(b=>b.onclick=()=>{S.ui.classId=b.dataset.c;save();renderClasses()});
  $$('[data-s]').forEach(b=>b.onclick=()=>{S.ui.subject=b.dataset.s;save();renderClasses()});
  $$('input.gr').forEach(inp=>inp.oninput=()=>{
    const tr=inp.closest('tr'),sid=tr.dataset.sid,max=+inp.dataset.max,raw=inp.value.trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
    const v=raw===''?null:+raw,bad=v!=null&&(isNaN(v)||v<0||v>max);inp.classList.toggle('bad',bad);if(bad)return;
    rowOf(sid,sub)[+inp.dataset.i]=v;save();const t=totals(sid,sub),[gl,gc]=grade(t.total,t.any);
    tr.querySelectorAll('.sum').forEach(td=>td.textContent=t.parts[+td.dataset.p]);tr.querySelector('.tot').textContent=t.any?t.total:'—';
    const tg=tr.querySelector('.tag');tg.className='tag '+gc;tg.textContent=gl;
  });
  $$('[data-del]').forEach(b=>b.onclick=()=>{if(!confirm('حذف "'+nameOf(b.dataset.del)+'" من '+c.name+'؟'))return;c.students=c.students.filter(s=>s.id!==b.dataset.del);(S.groups[c.id]||[]).forEach(g=>g.members=g.members.filter(m=>m!==b.dataset.del));save();renderClasses()});
  $('#addSt').onclick=()=>{const n=prompt('اسم الطالبة:');if(n&&n.trim()){c.students.push({id:c.id+'-'+uid(),name:n.trim()});save();renderClasses()}};
  $('#renameClass').onclick=()=>{const n=prompt('اسم الفصل:',c.name);if(n&&n.trim()){c.name=n.trim();save();renderClasses()}};
  $('#csv').onclick=()=>{const head=['م','اسم الطالبة'];gb.forEach(g=>{g.items.forEach(([n,m])=>head.push(`${n} (${m})`));head.push(`مجموع ${g.name} (${g.max})`)});head.push('المجموع الكلي','التقدير');
    const rows=[head];c.students.forEach((st,i)=>{const r=rowOf(st.id,sub),t=totals(st.id,sub);let k=0;const row=[i+1,st.name];gb.forEach((g,gi)=>{g.items.forEach(()=>row.push(r[k++]??''));row.push(t.parts[gi])});row.push(t.total,grade(t.total,t.any)[0]);rows.push(row)});
    download('﻿'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\r\n'),`درجات ${subjName} - ${c.name}.csv`,'text/csv;charset=utf-8')};
}

/* ===== الإعدادات ===== */
$('#openSettings').onclick=()=>{
  [['sTeacher','teacher'],['sSchool','school'],['sYear','year']].forEach(([id,k])=>{const i=$('#'+id);i.value=S.settings[k]||'';i.oninput=()=>{S.settings[k]=i.value;save();route()}});
  $('#setDlg').showModal();
};
$('#backup').onclick=()=>download(JSON.stringify(Object.assign({},S,{_prep:readKey(PREP_KEY),_progress:readKey(PROG_KEY)})),`نسخة مكتبة الدروس ${new Date().toISOString().slice(0,10)}.json`,'application/json');
$('#restore').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.classes)throw 0;try{if(d._prep)localStorage.setItem(PREP_KEY,JSON.stringify(d._prep));if(d._progress)localStorage.setItem(PROG_KEY,JSON.stringify(d._progress))}catch(_){}delete d._prep;delete d._progress;S=d;save();route();toast('تم الاستيراد')}catch(_){alert('الملف غير صالح')}};r.readAsText(f);e.target.value=''};
$('#factory').onclick=()=>{if(!confirm('حذف كل التعديلات والرجوع لبيانات الإكسل الأصلية؟'))return;const k=S.settings;S=fresh();S.settings=k;save();route();toast('تمت الاستعادة')};

route();
</script>

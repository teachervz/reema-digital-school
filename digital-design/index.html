<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>واجهة المستخدم وتجربة المستخدم | عرض تفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* =========================================================
   1) الهوية البصرية — «استوديو التصميم»
   ========================================================= */
:root{
  --p:#5B5BF7; --p2:#7B6CFF; --pd:#3B36C9; --pdd:#17153A;
  --ps:#ECEBFF; --pss:#F7F6FF; --line:#E3E1F4;
  --coral:#FF6B57; --pink:#FF5FA2; --mint:#13C6A3; --sun:#FFC542; --sky:#3DA5FF;
  --ok:#12B886; --okS:#E6FAF3; --bad:#FF4D6A; --badS:#FFF0F2;
  --ink:#17153A; --muted:#625F86;
  --r:26px;
  --shadow:0 22px 44px -22px rgba(40,30,140,.38);
  --shadow-s:0 10px 22px -12px rgba(40,30,140,.35);
  --font:'Readex Pro','Segoe UI',Tahoma,Arial,sans-serif;
  --pw:min(36vw,560px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);
  background:#121031;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body.idle{cursor:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;line-height:inherit}
input,textarea,select{font-family:inherit;-webkit-user-select:text;user-select:text}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#D5D2EE;border-radius:9px}

/* =========================================================
   2) المسرح 1920×1080 — لوحة فنية (Artboard) داخل برنامج تصميم
   ========================================================= */
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;transform-origin:center center;
  transition:left .45s cubic-bezier(.2,.8,.2,1),transform .45s cubic-bezier(.2,.8,.2,1);
  background:
    radial-gradient(900px 620px at 102% -6%, rgba(123,108,255,.20) 0%, transparent 62%),
    radial-gradient(820px 560px at -4% 106%, rgba(255,107,87,.16) 0%, transparent 60%),
    radial-gradient(600px 420px at 50% 120%, rgba(19,198,163,.10) 0%, transparent 70%),
    #F6F5FC;}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(91,91,247,.18) 1.6px,transparent 2px);background-size:36px 36px;}
/* المساطر */
.ruler-x{position:absolute;top:0;left:0;right:0;height:24px;z-index:4;background:rgba(255,255,255,.75);border-bottom:1px solid var(--line);
  background-image:repeating-linear-gradient(90deg,#CFCBEA 0 1px,transparent 1px 12px),repeating-linear-gradient(90deg,#A9A4D6 0 1px,transparent 1px 120px);
  background-size:auto 7px,auto 14px;background-repeat:repeat-x;background-position:0 100%,0 100%}
.ruler-y{position:absolute;top:24px;right:0;bottom:0;width:24px;z-index:4;background:rgba(255,255,255,.75);border-left:1px solid var(--line);
  background-image:repeating-linear-gradient(180deg,#CFCBEA 0 1px,transparent 1px 12px),repeating-linear-gradient(180deg,#A9A4D6 0 1px,transparent 1px 120px);
  background-size:7px auto,14px auto;background-repeat:repeat-y;background-position:0 0,0 0}
.pgnum{position:absolute;left:44px;bottom:30px;font-size:21px;font-weight:600;color:#A7A3CF;z-index:5;direction:ltr;letter-spacing:1px}
.brand{position:absolute;right:56px;bottom:30px;font-size:21px;font-weight:600;color:#A7A3CF;z-index:5}
.ab-label{position:absolute;top:40px;left:64px;z-index:5;direction:ltr;font-size:19px;font-weight:500;color:#9B97C6;display:flex;gap:10px;align-items:center}
.ab-label i{width:14px;height:14px;border:2px solid #B7B3E0;border-radius:3px}

/* ---------- الشرائح والانتقالات ---------- */
.slide{position:absolute;inset:0;visibility:hidden;opacity:0;pointer-events:none}
.slide.active{visibility:visible;opacity:1;pointer-events:auto;z-index:3}
.slide.leaving{visibility:visible;z-index:2;animation:slideOut .45s ease forwards}
.slide.in-fade{animation:inFade .7s ease backwards}
.slide.in-zoom{animation:inZoom .75s cubic-bezier(.2,.8,.2,1) backwards}
.slide.in-slide-next{animation:inSlideN .7s cubic-bezier(.2,.8,.2,1) backwards}
.slide.in-slide-prev{animation:inSlideP .7s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes slideOut{to{opacity:0;transform:scale(.98)}}
@keyframes inFade{from{opacity:0}}
@keyframes inZoom{from{opacity:0;transform:scale(.92)}}
@keyframes inSlideN{from{opacity:0;transform:translateX(-90px)}}
@keyframes inSlideP{from{opacity:0;transform:translateX(90px)}}
.slide.active .rv{animation:rise .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 110ms + 180ms)}
@keyframes rise{from{opacity:0;transform:translateY(34px)}}

.slide-inner{position:absolute;inset:78px 120px 104px;display:flex;flex-direction:column;gap:20px}
.content{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;min-height:0}
/* الوسم = طبقة في لوحة الطبقات */
.tag{align-self:flex-start;display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);color:var(--pd);padding:6px 24px 6px 18px;
  border-radius:12px;font-size:25px;font-weight:600;box-shadow:var(--shadow-s)}
.tag::before{content:"";width:16px;height:16px;border-radius:5px;background:linear-gradient(135deg,var(--coral),var(--pink))}
/* العنوان مع إطار التحديد */
.title{align-self:flex-start;font-size:62px;font-weight:700;color:var(--pdd);line-height:1.25}
.title::after{content:"";display:block;width:150px;height:8px;border-radius:9px;margin-top:12px;
  background:linear-gradient(90deg,var(--p) 0 25%,var(--mint) 25% 50%,var(--sun) 50% 75%,var(--coral) 75%)}
.sel{position:relative;display:inline-block}
.sel::before{content:"";position:absolute;inset:-8px -16px;border:2px solid var(--p);border-radius:2px;opacity:0;pointer-events:none}
.hd{position:absolute;width:14px;height:14px;background:#fff;border:2px solid var(--p);opacity:0;pointer-events:none}
.hd.a{top:-15px;right:-23px}.hd.b{top:-15px;left:-23px}.hd.c{bottom:-15px;right:-23px}.hd.d{bottom:-15px;left:-23px}
.dim{position:absolute;bottom:-46px;left:50%;transform:translateX(-50%);background:var(--p);color:#fff;font-size:16px;font-weight:500;padding:1px 10px;border-radius:6px;direction:ltr;opacity:0;white-space:nowrap;pointer-events:none}
.slide.active .sel::before,.slide.active .hd,.slide.active .dim{animation:selFlash 2.4s .6s ease both}
@keyframes selFlash{0%{opacity:0}12%,72%{opacity:1}100%{opacity:0}}
.lead{font-size:34px;color:var(--muted);font-weight:500;line-height:1.5}
.lead b{color:var(--pd)}
.lead.ok-text{color:var(--ok)}
.center-row{display:flex;justify-content:center;gap:20px}

/* ---------- أزرار ---------- */
.btn{font-size:29px;font-weight:600;padding:14px 38px;border-radius:18px;transition:transform .2s,box-shadow .2s,background .2s,opacity .2s}
.btn.primary{background:linear-gradient(135deg,var(--p2),var(--pd));color:#fff;box-shadow:0 14px 26px -12px rgba(59,54,201,.8)}
.btn.hot{background:linear-gradient(135deg,var(--coral),var(--pink));color:#fff;box-shadow:0 14px 26px -12px rgba(255,95,162,.8)}
.btn.ghost{background:#fff;color:var(--pd);border:3px solid var(--ps);box-shadow:var(--shadow-s)}
.btn.ok{background:var(--ok);color:#fff}
.btn.lg{font-size:36px;padding:18px 54px}
.btn:hover{transform:translateY(-3px)}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes floaty{50%{transform:translateY(-16px) rotate(3deg)}}

/* ---------- الترحيب ---------- */
.hero{flex:1;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:30px}
.pill{display:inline-flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);color:var(--pd);font-size:26px;font-weight:600;padding:8px 26px;border-radius:14px;box-shadow:var(--shadow-s)}
.pill i{width:12px;height:12px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 5px rgba(19,198,163,.2)}
.hero-title{font-size:96px;font-weight:700;line-height:1.22;margin:22px 0 10px;color:var(--pdd)}
.hero-title .k{display:inline-block;direction:ltr;font-weight:700;padding:0 18px;border-radius:18px;color:#fff;font-size:.82em;line-height:1.25;transform:rotate(-2deg)}
.hero-title .k.ui{background:linear-gradient(135deg,var(--p2),var(--pd))}
.hero-title .k.ux{background:linear-gradient(135deg,var(--coral),var(--pink));transform:rotate(2deg)}
.hero-sub{font-size:36px;font-weight:400;color:var(--muted);line-height:1.55;margin-bottom:22px}
.hero-sub b{color:var(--pd);font-weight:600}
.hero-meta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.hero-meta span{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 20px;font-size:24px;font-weight:500;color:var(--muted)}
.hero-teams{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:26px;font-size:22px}
.hero-teams b{color:var(--pd);margin-left:6px;font-weight:600}
.hero-teams span{background:var(--c);color:#fff;border-radius:10px;padding:3px 14px;font-weight:500;font-size:20px}
/* لوحة رسم متحركة: موقع يتحول من مخطط هيكلي إلى تصميم مرئي */
.hero-art{position:relative;width:700px;height:620px;justify-self:center}
.hw{position:absolute;inset:40px 30px 60px 40px;background:#fff;border-radius:22px;box-shadow:0 40px 70px -30px rgba(40,30,140,.5);overflow:hidden;border:2px solid var(--line);animation:floaty 7s ease-in-out infinite}
.hw-bar{display:flex;align-items:center;gap:14px;padding:12px 16px;background:#F2F1FA;direction:ltr}
.dots{display:flex;gap:7px}.dots i{width:13px;height:13px;border-radius:50%;background:#FF6B6B}.dots i:nth-child(2){background:#FFC542}.dots i:nth-child(3){background:#2ED6A0}
.hw-url{flex:1;background:#fff;border-radius:8px;padding:2px 14px;font-size:16px;color:var(--muted)}
.hw-body{padding:18px;display:flex;flex-direction:column;gap:14px;height:calc(100% - 46px)}
.pb{border:3px dashed #CFCBE6;border-radius:12px;background:#fff;animation:paint 8s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes paint{0%,28%{background:#fff;border-color:#CFCBE6} 40%,86%{background:var(--pc);border-color:transparent} 100%{background:#fff;border-color:#CFCBE6}}
.hw-nav{display:flex;gap:10px;align-items:center}
.hw-nav .pb{height:30px}.hw-nav .pb:first-child{width:90px;--pc:var(--pdd)}.hw-nav .pb:not(:first-child){width:62px;--pc:#E5E3FA;margin-right:auto}
.hw-nav .pb:nth-child(3),.hw-nav .pb:nth-child(4){margin-right:0}
.hw-hero{flex:1.3;--pc:linear-gradient(0,#000,#000);display:flex;gap:16px}
.hw-hero .pb.big{flex:1.2;--pc:#ECEBFF;--d:.3s;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:18px}
.hw-hero .pb.img{flex:1;--pc:#FFD9D2;--d:.6s;display:grid;place-items:center;font-size:70px}
.ln{height:16px;border-radius:8px;background:#DEDBF3}.ln.w1{width:90%;background:#B9B4EE}.ln.w2{width:70%}.ln.w3{width:46%;height:34px;border-radius:10px;background:var(--coral);margin-top:6px}
.hw-cards{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hw-cards .pb:nth-child(1){--pc:#D6F6EE;--d:.9s}.hw-cards .pb:nth-child(2){--pc:#FFF1CC;--d:1.1s}.hw-cards .pb:nth-child(3){--pc:#DCEBFF;--d:1.3s}
.hw-swatch{position:absolute;top:0;left:0;display:flex;gap:10px;background:#fff;padding:12px 14px;border-radius:16px;box-shadow:var(--shadow);animation:floaty 5s ease-in-out infinite -2s}
.hw-swatch i{width:34px;height:34px;border-radius:50%;background:var(--c)}
.hw-type{position:absolute;bottom:4px;right:0;background:#fff;padding:10px 20px;border-radius:16px;box-shadow:var(--shadow);font-size:40px;font-weight:700;color:var(--pdd);animation:floaty 6s ease-in-out infinite -1s;direction:ltr}
.hw-type small{font-size:16px;color:var(--muted);display:block;font-weight:400}
.mcur{position:absolute;display:flex;align-items:flex-start;gap:2px;z-index:3;pointer-events:none}
.mcur svg{width:34px;height:34px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.mcur span{margin-top:24px;color:#fff;font-size:18px;font-weight:600;padding:2px 12px;border-radius:8px;white-space:nowrap}
.mcur.c1{animation:cur1 9s ease-in-out infinite}.mcur.c1 span{background:var(--p)}
.mcur.c2{animation:cur2 11s ease-in-out infinite}.mcur.c2 span{background:var(--coral)}
@keyframes cur1{0%,100%{top:150px;left:120px}30%{top:300px;left:380px}60%{top:420px;left:180px}}
@keyframes cur2{0%,100%{top:470px;left:470px}35%{top:200px;left:520px}70%{top:360px;left:300px}}

/* ---------- الأهداف ---------- */
.goals{display:flex;flex-direction:column;gap:16px;width:1400px;align-self:center}
.goal{width:100%;display:flex;align-items:center;gap:24px;background:#fff;border:3px solid var(--line);border-radius:22px;
  padding:14px 28px;font-size:32px;font-weight:500;text-align:right;box-shadow:var(--shadow-s);transition:.25s}
.goal:hover{border-color:var(--p2);transform:translateX(-8px)}
.goal-n{width:60px;height:60px;border-radius:16px;background:var(--ps);color:var(--pd);display:flex;align-items:center;justify-content:center;flex:none;font-weight:700}
.goal-ic{font-size:42px}
.goal-t{flex:1}
.goal-check{width:56px;height:56px;border-radius:50%;border:3px dashed var(--line);display:flex;align-items:center;justify-content:center;color:transparent;font-size:32px}
.goal.done{background:var(--okS);border-color:var(--ok)}
.goal.done .goal-check{background:var(--ok);border:0;color:#fff;animation:pop .4s}
.goals.grid{display:grid;grid-template-columns:1fr 1fr;width:1700px;gap:16px 24px}
.goals.grid .goal{font-size:28px;padding:14px 22px;min-height:100px}
.goals.grid .goal:hover{transform:translateY(-4px)}
.hint-sm{font-size:25px;color:#9B97C6;font-weight:500;text-align:center}

/* ---------- تصويت: أي الشاشتين؟ ---------- */
.vs{display:flex;align-items:center;justify-content:center;gap:40px}
.vs-card{width:640px;background:#fff;border:3px solid var(--line);border-radius:30px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:var(--shadow);transition:.4s}
.vs-label{font-size:28px;font-weight:600;color:var(--pd)}
.vs-mock{width:100%;height:370px;border-radius:20px;overflow:hidden;position:relative}
.vs-mid{width:96px;height:96px;border-radius:50%;background:var(--pdd);color:#fff;font-size:34px;font-weight:700;display:grid;place-items:center;flex:none;box-shadow:0 0 0 12px var(--ps);direction:ltr}
.vs-btn b{display:inline-block;min-width:44px;background:var(--ps);border-radius:10px;margin-right:10px;color:var(--pd)}
.vs-card.win{border-color:var(--ok);box-shadow:0 0 0 8px rgba(18,184,134,.18),var(--shadow);transform:scale(1.03)}
.vs-card.win .vs-label::after{content:" 👑"}
.vs-card.lose{opacity:.6;transform:scale(.97)}
/* الشاشة السيئة */
.bad-ui{height:100%;background:repeating-linear-gradient(45deg,#FFE65C 0 22px,#FF9F43 22px 44px);padding:22px 24px;display:flex;flex-direction:column;gap:8px;font-family:'Comic Sans MS',cursive}
.bad-ui .bt{font-size:17px;color:#F5A623;background:#FFF59D;align-self:flex-start;padding:2px 8px;transform:rotate(-3deg)}
.bad-ui .bi{background:#EEE;height:34px;border:1px solid #DDD;color:#C9C9C9;font-size:13px;padding:6px}
.bad-ui .bx{display:flex;gap:2px;justify-content:center}
.bad-ui .bx span{background:#7CB342;color:#9CCC65;font-size:12px;padding:3px 8px}
.bad-ui .bn{font-size:12px;color:#FFD54F;line-height:1.3}
.bad-ui .bm{position:absolute;bottom:18px;left:16px;right:16px;background:#E91E63;color:#FFEB3B;font-size:20px;padding:8px;text-align:center;animation:blink 1s infinite;font-weight:700}
/* الشاشة الجيدة */
.good-ui{height:100%;background:linear-gradient(180deg,#F7F6FF,#fff);padding:30px 50px;display:flex;flex-direction:column;gap:14px;text-align:right}
.good-ui .gl{width:62px;height:62px;border-radius:18px;background:linear-gradient(135deg,var(--p2),var(--pd));color:#fff;display:grid;place-items:center;font-size:32px;align-self:center}
.good-ui h4{font-size:30px;text-align:center;color:var(--pdd);font-weight:700}
.good-ui label{font-size:18px;color:var(--muted);font-weight:500}
.good-ui .gi{height:50px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:18px;color:#A6A3C8;padding:10px 14px}
.good-ui .gb{height:56px;border-radius:14px;background:var(--p);color:#fff;font-size:22px;font-weight:600;display:grid;place-items:center;margin-top:6px}
.good-ui .gk{font-size:17px;color:var(--p);text-align:center}

/* ---------- العصف الذهني ---------- */
.bs{flex:1;display:flex;gap:36px;min-height:0}
.bs-side{width:560px;display:flex;flex-direction:column;gap:22px;justify-content:center}
.bs-prompt{background:#fff;border-radius:var(--r);padding:26px 30px;font-size:32px;font-weight:500;line-height:1.5;box-shadow:var(--shadow);border-right:10px solid var(--coral)}
.bs-input{display:flex;gap:12px}
.bs-input input{flex:1;min-width:0;font-size:28px;padding:12px 22px;border-radius:16px;border:3px solid var(--line);outline:none;background:#fff;color:var(--ink)}
.bs-input input:focus{border-color:var(--p2)}
.bs-btns{display:flex;gap:12px;flex-wrap:wrap}
.bs-btns .btn{font-size:25px;padding:12px 24px}
.bs-area{flex:1;position:relative;background:#fff;border-radius:34px;border:3px dashed var(--line);overflow:hidden}
.bs-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:230px;height:230px;border-radius:40px;
  background:linear-gradient(140deg,var(--coral),var(--pink));color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:32px;font-weight:700;line-height:1.3;box-shadow:0 0 0 18px #FFE9EE,var(--shadow);z-index:2;rotate:-4deg}
.bubble{position:absolute;transform:translate(-50%,-50%);background:#fff;border:3px solid var(--c);color:var(--c);
  padding:8px 22px;border-radius:14px;font-size:27px;font-weight:600;white-space:nowrap;box-shadow:var(--shadow-s);animation:bubIn .5s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes bubIn{from{transform:translate(-50%,-50%) scale(0);opacity:0}}

/* ---------- سؤال + خيارات ---------- */
.q-card{background:#fff;border-radius:var(--r);padding:24px 36px;box-shadow:var(--shadow);display:flex;gap:22px;
  align-items:center;font-size:38px;font-weight:600;line-height:1.45;border-right:12px solid var(--p)}
.q-ic{font-size:52px;flex:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.opt{position:relative;background:#fff;border:3px solid var(--line);border-radius:22px;padding:18px 26px;font-size:32px;font-weight:500;
  display:flex;align-items:center;gap:20px;text-align:right;box-shadow:var(--shadow-s);transition:transform .2s,border-color .2s,background .2s,opacity .3s}
.opt:hover{transform:translateY(-4px);border-color:var(--p2)}
.opt-ic{font-size:40px;width:72px;height:72px;flex:none;border-radius:18px;background:var(--pss);display:flex;align-items:center;justify-content:center}
.opt.correct{background:var(--okS);border-color:var(--ok);color:#065F46}
.opt.correct::after{content:"✓";position:absolute;left:24px;font-size:44px;color:var(--ok);animation:pop .4s}
.opt.wrong{border-color:var(--bad);background:var(--badS);animation:shake .5s}
.opt.dim{opacity:.4;pointer-events:none}
.feedback{min-height:56px;font-size:38px;font-weight:700;text-align:center}
.feedback.ok{color:var(--ok)} .feedback.bad{color:var(--pink)}
.feedback.pop{animation:pop .45s}
.explain{background:#FFF8E6;border:3px dashed #FFD27A;border-radius:22px;padding:16px 28px;font-size:28px;font-weight:500;line-height:1.55;
  opacity:0;transform:translateY(14px);transition:.5s}
.explain.show{opacity:1;transform:none}
.mcq{flex:1;display:flex;gap:56px;align-items:center;min-height:0}
.mcq-main{flex:1;display:flex;flex-direction:column;gap:20px}
.scene{flex:none}
.scene-card{width:420px;height:520px;border-radius:40px;background:linear-gradient(160deg,#10A37F,#0B6B53);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:30px;box-shadow:var(--shadow)}
.scene-card .sc-big{font-size:140px;animation:floaty 4s ease-in-out infinite}
.scene-card .sc-t{font-size:34px;font-weight:700;line-height:1.4}
.scene-card .sc-s{font-size:22px;opacity:.85}
.phone-s{width:360px;height:640px;border:14px solid #1D1A40;border-radius:56px;background:linear-gradient(170deg,#2B2670,#17153A);position:relative;box-shadow:0 30px 60px -20px rgba(40,10,90,.6);padding:80px 26px 26px;display:flex;flex-direction:column;align-items:center;gap:26px;animation:floaty 5s ease-in-out infinite}
.phone-s::before{content:"";position:absolute;top:14px;left:50%;transform:translateX(-50%);width:110px;height:26px;border-radius:20px;background:#1D1A40}
.ph-time{color:#fff;font-size:64px;font-weight:300;direction:ltr}
.ph-say{background:#fff;color:var(--ink);border-radius:24px 24px 6px 24px;padding:16px 20px;font-size:24px;font-weight:500;line-height:1.5;align-self:stretch}
.ph-mic{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--pink));display:grid;place-items:center;font-size:52px;box-shadow:0 0 0 14px rgba(255,95,162,.25),0 0 0 30px rgba(255,95,162,.12);animation:pulse 1.6s infinite}

/* ---------- الفراغات ---------- */
.def-card{background:#fff;border-radius:34px;padding:38px 50px;box-shadow:var(--shadow);border-top:12px solid var(--p);position:relative}
.def-card.ux{border-top-color:var(--coral)}
.def-src{font-size:28px;font-weight:600;color:var(--coral);margin-bottom:10px}
.def-card.ux .def-src{color:var(--pd)}
.def-text{font-size:40px;font-weight:400;line-height:2.1}
.blank{position:relative;display:inline-block;margin:0 6px;padding:0 18px;line-height:1.5;border-radius:12px;background:var(--pss);
  border-bottom:5px dashed var(--p2);font-size:40px;font-weight:700;transition:.3s}
.blank span{color:transparent}
.blank::after{content:"؟";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--p2)}
.blank:hover{background:var(--ps)}
.blank.open{background:#EFEDFF;border-bottom-style:solid}
.blank.open span{color:var(--pd);animation:pop .4s;display:inline-block}
.blank.open::after{content:none}
.note-card{display:flex;align-items:center;gap:26px;background:linear-gradient(135deg,#fff,var(--pss));border:3px solid var(--line);
  border-radius:28px;padding:20px 34px;font-size:29px;font-weight:500;line-height:1.55}
.note-card .ni{font-size:66px}
.note-card .chips{justify-content:flex-start}

/* ---------- البطاقات المقلوبة ---------- */
.cards{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:28px}
.fc-wrap{perspective:1500px;height:var(--h,500px)}
.fc{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.2,.8,.2,1)}
.fc-wrap:hover .fc:not(.flipped){transform:translateY(-8px)}
.fc.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:var(--r);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center}
.fc-front{background:#fff;border:3px solid var(--line);border-top:14px solid var(--c);box-shadow:var(--shadow)}
.fc-back{transform:rotateY(180deg);color:#fff;background:var(--c);
  background:linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 62%,#17153A));box-shadow:var(--shadow)}
.fc-ic{font-size:96px;animation:floaty 5s ease-in-out infinite}
.fc-title{font-size:34px;font-weight:700;line-height:1.35}
.fc-title.sm{font-size:28px;opacity:.9}
.fc-back p{font-size:28px;font-weight:400;line-height:1.6}
.fc-back p b{font-weight:700;background:rgba(255,255,255,.2);padding:0 8px;border-radius:8px}
.fc-hint{font-size:21px;color:#A7A3CF;font-weight:500}
.fc-mem{font-size:19px;color:var(--muted);line-height:1.4}

/* ---------- التصنيف ---------- */
.sort-wrap{flex:1;display:grid;grid-template-columns:1fr 600px 1fr;gap:34px;min-height:0}
.bucket{background:#fff;border:4px solid var(--c);border-radius:32px;display:flex;flex-direction:column;padding:22px;gap:12px;transition:.25s;text-align:right;overflow:hidden}
.bucket:hover{transform:translateY(-5px);box-shadow:0 20px 36px -16px var(--c)}
.bucket:active{transform:scale(.98)}
.bk-head{display:flex;align-items:center;gap:14px;font-size:32px;font-weight:700;color:var(--c)}
.bk-ic{font-size:56px}
.bk-count{margin-inline-start:auto;background:var(--c);color:#fff;border-radius:12px;min-width:60px;text-align:center;font-size:30px;padding:2px 14px}
.bk-list{display:flex;flex-direction:column;gap:8px;overflow:hidden;flex:1}
.bk-chip{font-size:21px;font-weight:500;background:var(--pss);border-right:6px solid var(--c);padding:6px 14px;border-radius:10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:pop .4s}
.bk-empty{font-size:23px;color:#B5B1D9;font-weight:500;text-align:center;margin-top:30px}
.sort-center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.sort-prog{font-size:26px;font-weight:600;color:var(--muted);background:#fff;padding:4px 26px;border-radius:12px;border:2px solid var(--line);direction:ltr}
.sort-card{width:100%;min-height:320px;background:linear-gradient(160deg,#fff,var(--pss));border:3px solid var(--line);border-radius:34px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:36px;font-weight:600;text-align:center;padding:30px;line-height:1.45;box-shadow:var(--shadow)}
.sort-card .sc-ic{font-size:92px}
.sort-card.enter{animation:pop .45s}
.sort-hint{font-size:24px;color:#A7A3CF;font-weight:500}

/* ---------- الكشف ---------- */
.reveal-grid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:26px}
.rev{position:relative;height:var(--h,300px);border-radius:var(--r);overflow:hidden;background:#fff;border:3px solid var(--line);box-shadow:var(--shadow-s);transition:transform .25s}
.rev:hover{transform:translateY(-5px)}
.rev-cover{position:absolute;inset:0;z-index:2;background:linear-gradient(140deg,var(--p2),var(--pd));color:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:92px;font-weight:700;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .6s}
.rev-cover small{font-size:23px;font-weight:500;opacity:.85}
.rev:nth-child(4n+2) .rev-cover{background:linear-gradient(140deg,var(--coral),#D63B6E)}
.rev:nth-child(4n+3) .rev-cover{background:linear-gradient(140deg,#2BD9B5,#0B8A72)}
.rev:nth-child(4n+4) .rev-cover{background:linear-gradient(140deg,#FFC542,#D98A0B)}
.rev.open .rev-cover{transform:translateY(-105%);opacity:0}
.rev-content{height:100%;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.rev-ic{font-size:64px}.rev-t{font-size:31px;font-weight:700;line-height:1.35}.rev-content p{font-size:24px;color:var(--muted);font-weight:400;line-height:1.5}

/* ---------- المقارنة ---------- */
.cmp{background:#fff;border-radius:30px;padding:16px 30px;box-shadow:var(--shadow)}
.cmp-head,.cmp-row{display:grid;grid-template-columns:220px 1fr 1fr;gap:24px;align-items:center}
.cmp-col{text-align:center;padding:12px;border-radius:22px;background:color-mix(in srgb,var(--c) 10%,white)}
.cmp-ic{font-size:50px;line-height:1.2}.cmp-name{font-size:32px;font-weight:700;color:var(--c)}.cmp-an{font-size:22px;font-weight:400;color:var(--muted)}
.cmp-row{padding:12px 0;border-top:2px dashed var(--line);font-size:26px;font-weight:400;opacity:.08;transition:opacity .5s,transform .5s;transform:translateY(10px)}
.cmp-row.show{opacity:1;transform:none}
.cmp-k{font-weight:700;color:var(--pd);font-size:27px}
.cmp-v{text-align:center;line-height:1.45}

/* ---------- المطابقة ---------- */
.match{display:grid;grid-template-columns:420px 1fr;gap:0 60px}
.m-col{display:flex;flex-direction:column;gap:13px}
.m-item{position:relative;min-height:78px;background:#fff;border:3px solid var(--line);border-radius:20px;font-size:28px;font-weight:400;
  padding:8px 26px;text-align:right;display:flex;align-items:center;transition:.25s;box-shadow:var(--shadow-s)}
.m-item:hover{border-color:var(--p2)}
.m-item.term{justify-content:space-between;font-size:30px;font-weight:700;color:var(--pd);background:var(--pss)}
.m-item.term small{font-size:19px;color:var(--muted);direction:ltr;font-weight:500}
.m-item.sel{border-color:var(--p);box-shadow:0 0 0 6px rgba(91,91,247,.22);transform:scale(1.02)}
.m-item.matched{border-color:var(--mc);background:#fff;pointer-events:none;padding-left:76px}
.m-item.matched::after{content:attr(data-badge);position:absolute;left:16px;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:12px;
  background:var(--mc);color:#fff;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;animation:pop .4s}

/* ---------- صح أم خطأ ---------- */
.tf-list{display:flex;flex-direction:column;gap:14px}
.tf-row{display:grid;grid-template-columns:62px 1fr auto;gap:22px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:22px;padding:12px 24px;box-shadow:var(--shadow-s);transition:.3s}
.tf-n{width:54px;height:54px;border-radius:14px;background:var(--ps);color:var(--pd);font-size:27px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tf-t{font-size:30px;font-weight:500;line-height:1.45}
.tf-why{font-size:22px;font-weight:400;color:var(--muted);display:none;margin-top:2px}
.tf-why.show{display:block;animation:pop .4s}
.tf-why.bad{color:var(--pink)}
.tf-btns{display:flex;gap:12px}
.tf-b{font-size:26px;font-weight:600;padding:8px 26px;border-radius:14px;border:3px solid;background:#fff;transition:.2s}
.tf-b:hover{transform:translateY(-3px)}
.tf-b.yes{color:#059669;border-color:#A7F3D0}.tf-b.no{color:#E11D48;border-color:#FECDD3}
.tf-row.solved{border-color:var(--ok);background:#F5FFFA}
.tf-row.solved .tf-n{background:var(--ok);color:#fff}
.tf-row.solved .tf-b{pointer-events:none;opacity:.35}
.tf-row.solved .tf-b.right{opacity:1;background:var(--ok);color:#fff;border-color:var(--ok)}

/* ---------- المؤقت ---------- */
.timer-box{display:flex;align-items:center;gap:16px}
.timer{position:relative;width:136px;height:136px;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.tr-bg{fill:#fff;stroke:var(--ps);stroke-width:10}
.tr-fg{fill:none;stroke:var(--p);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
.tr-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;direction:ltr}
.timer-box.warn .tr-fg{stroke:var(--sun)}
.timer-box.end .tr-fg{stroke:var(--bad)}
.timer-box.end .timer{animation:pulse 1s 3}
@keyframes pulse{50%{transform:scale(1.08)}}
.tr-btns{display:flex;flex-direction:column;gap:10px}
.tbtn{width:58px;height:58px;border-radius:16px;background:#fff;border:3px solid var(--line);font-size:25px;color:var(--pd);font-weight:700;transition:.2s}
.tbtn:hover{border-color:var(--p2);transform:scale(1.08)}
.timer-box.big{flex-direction:column}
.timer-box.big .timer{width:320px;height:320px}
.timer-box.big .tr-txt{font-size:88px}
.timer-box.big .tr-btns{flex-direction:row}
.timer-box.big .tbtn{width:72px;height:72px;font-size:31px}

/* ---------- فكّري زاوجي شاركي ---------- */
.chips{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.chip{background:#fff;border:2px solid var(--line);padding:8px 22px;border-radius:14px;font-size:25px;font-weight:500;box-shadow:var(--shadow-s)}
.chip.lg{font-size:29px;padding:10px 26px}

/* ---------- محاكي أنواع الواجهات ---------- */
.sim{flex:1;display:grid;grid-template-columns:430px 1fr;gap:34px;min-height:0}
.sim-tabs{display:flex;flex-direction:column;gap:18px;justify-content:center}
.sim-tab{display:grid;grid-template-columns:84px 1fr;grid-template-rows:auto auto;column-gap:18px;align-items:center;text-align:right;background:#fff;border:3px solid var(--line);border-radius:24px;padding:18px 22px;box-shadow:var(--shadow-s);transition:.25s;position:relative}
.sim-tab span{grid-row:span 2;width:84px;height:84px;border-radius:22px;background:color-mix(in srgb,var(--c) 14%,white);display:grid;place-items:center;font-size:46px}
.sim-tab b{font-size:31px;font-weight:700}
.sim-tab small{font-size:20px;color:var(--muted);direction:ltr;text-align:right}
.sim-tab:hover{transform:translateX(-6px)}
.sim-tab.on{border-color:var(--c);box-shadow:0 18px 32px -16px var(--c);transform:translateX(-12px)}
.sim-tab.on b{color:var(--c)}
.sim-tab.seen::after{content:"✓";position:absolute;left:18px;top:18px;width:34px;height:34px;border-radius:50%;background:var(--ok);color:#fff;font-size:20px;display:grid;place-items:center}
.sim-stage{position:relative;display:flex;flex-direction:column;gap:18px;min-height:0}
.sim-view{display:none;flex:1;min-height:0;border-radius:30px;position:relative;overflow:hidden}
.sim-view.on{display:flex;animation:pop .45s}
.sim-def{background:#fff;border-radius:22px;padding:16px 26px;font-size:26px;line-height:1.55;box-shadow:var(--shadow-s);border-right:8px solid var(--c,var(--p));min-height:96px}
.sim-def b{color:var(--c,var(--p))}
/* سطر الأوامر */
.v-cli{background:#0F0E26;flex-direction:column;padding:26px 34px;gap:8px;direction:ltr;text-align:left;font-family:Consolas,'Courier New',monospace;color:#C9F7E5;font-size:28px}
.v-cli .cl{white-space:pre}
.v-cli .pr{color:#7B6CFF}
.v-cli .out{color:#8E8BB8}
.v-cli .caret{display:inline-block;width:14px;height:30px;background:#2ED6A0;vertical-align:middle;animation:blink 1s infinite}
.v-cli .cli-go{position:absolute;bottom:22px;right:26px;font-family:var(--font)}
@keyframes blink{50%{opacity:.15}}
/* الرسومية */
.v-gui{background:linear-gradient(135deg,#ECEBFF,#FFE9EE);align-items:center;justify-content:center;gap:60px}
.gphone{width:330px;height:560px;border:12px solid #1D1A40;border-radius:50px;background:linear-gradient(170deg,#7B6CFF,#FF5FA2);padding:60px 20px 20px;position:relative;box-shadow:var(--shadow)}
.gphone::before{content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);width:96px;height:22px;border-radius:14px;background:#1D1A40}
.gapps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.gapp{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font-size:15px;font-weight:500}
.gapp i{font-style:normal;width:74px;height:74px;border-radius:20px;background:rgba(255,255,255,.92);display:grid;place-items:center;font-size:40px;box-shadow:0 6px 12px -6px rgba(0,0,0,.35);transition:.2s}
.gapp:hover i{transform:scale(1.1)}
.gopen{position:absolute;inset:8px;border-radius:38px;background:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--ink);font-size:26px;font-weight:600}
.gopen.on{display:flex;animation:inZoom .35s}
.gopen .gi{font-size:110px}
.gopen button{font-size:20px;color:var(--p);margin-top:10px}
.gui-note{max-width:420px;font-size:28px;line-height:1.6;color:var(--muted)}
.gui-note b{color:var(--pd)}
/* الصوت */
.v-voice{background:radial-gradient(circle at 50% 40%,#2B2670,#120F33);flex-direction:column;align-items:center;justify-content:center;gap:26px;color:#fff}
.vmic{width:170px;height:170px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--pink));font-size:80px;display:grid;place-items:center;position:relative}
.vmic::before,.vmic::after{content:"";position:absolute;inset:-18px;border-radius:50%;border:3px solid rgba(255,95,162,.6);opacity:0}
.v-voice.listen .vmic::before{animation:ring 1.4s infinite}.v-voice.listen .vmic::after{animation:ring 1.4s .7s infinite}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.6);opacity:0}}
.wave{display:flex;gap:8px;align-items:center;height:70px}
.wave i{width:10px;border-radius:9px;background:#9D93FF;height:12px;transition:height .15s}
.v-voice.listen .wave i{animation:wv .8s ease-in-out infinite;animation-delay:calc(var(--k) * -.11s)}
@keyframes wv{50%{height:66px;background:#FF8FB8}}
.vbub{max-width:900px;font-size:30px;line-height:1.5;padding:14px 26px;border-radius:24px;opacity:0;transform:translateY(10px);transition:.4s}
.vbub.on{opacity:1;transform:none}
.vbub.me{background:#fff;color:var(--ink);border-radius:24px 24px 6px 24px}
.vbub.ai{background:linear-gradient(135deg,#5B5BF7,#7B6CFF);border-radius:24px 24px 24px 6px}
.vbub .sw{display:inline-flex;gap:8px;vertical-align:middle;margin-right:10px}.vbub .sw i{width:28px;height:28px;border-radius:50%;border:3px solid #fff;background:var(--c)}

/* ---------- شكل فن (Venn) ---------- */
.venn-wrap{flex:1;display:grid;grid-template-columns:520px 1fr;gap:40px;align-items:center;min-height:0}
.venn-side{display:flex;flex-direction:column;gap:18px;align-items:center}
.venn-side .lead{font-size:28px;text-align:center}
.venn{position:relative;width:1010px;height:600px;justify-self:center}
.vz{position:absolute;top:0;width:600px;height:600px;border-radius:50%;border:5px solid var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);transition:.25s;display:flex;flex-direction:column;align-items:center;padding-top:44px;gap:10px}
.vz:hover{background:color-mix(in srgb,var(--c) 22%,transparent)}
.vz.ui{right:0;--c:var(--p)}.vz.ux{left:0;--c:var(--coral)}
.vz-t{font-size:32px;font-weight:700;color:var(--c);background:#fff;padding:4px 20px;border-radius:14px;box-shadow:var(--shadow-s)}
.vz-list{display:flex;flex-direction:column;gap:8px;width:330px}
.vz.ui .vz-list{margin-right:150px}.vz.ux .vz-list{margin-left:150px}
.vz-both{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:220px;min-height:300px;border-radius:30px;border:4px dashed var(--mint);background:rgba(255,255,255,.75);z-index:2;display:flex;flex-direction:column;align-items:center;padding:16px 10px;gap:8px;transition:.25s}
.vz-both:hover{background:#fff}
.vz-both .vz-t{--c:var(--mint);font-size:26px}
.vz-both .vz-list{width:196px}
.vchip{font-size:19px;font-weight:500;background:#fff;border-radius:10px;padding:5px 10px;border-right:5px solid var(--c);text-align:right;line-height:1.35;animation:pop .4s;box-shadow:0 4px 10px -6px rgba(0,0,0,.25)}

/* ---------- مختبر إصلاح الواجهة ---------- */
.fix{flex:1;display:grid;grid-template-columns:600px 1fr;gap:40px;min-height:0}
.fix-side{display:flex;flex-direction:column;gap:14px;justify-content:center}
.fix-side .lead{font-size:28px}
.fix-t{display:flex;align-items:center;gap:16px;background:#fff;border:3px solid var(--line);border-radius:20px;padding:12px 20px;font-size:27px;font-weight:500;text-align:right;transition:.25s;box-shadow:var(--shadow-s)}
.fix-t:hover{border-color:var(--p2);transform:translateX(-6px)}
.fix-t .tg{width:66px;height:36px;border-radius:99px;background:#DCDAEE;position:relative;flex:none;transition:.25s}
.fix-t .tg::after{content:"";position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.fix-t.on{border-color:var(--ok);background:var(--okS)}
.fix-t.on .tg{background:var(--ok)}.fix-t.on .tg::after{right:34px}
.meter{display:flex;align-items:center;gap:16px;font-size:25px;font-weight:600;color:var(--muted);background:#fff;border-radius:18px;padding:12px 20px;box-shadow:var(--shadow-s)}
.mt-bar{flex:1;height:22px;border-radius:99px;background:var(--pss);overflow:hidden}
.mt-bar i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,var(--bad),var(--sun));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.mt-emo{font-size:46px}
.fix-canvas{position:relative;border-radius:34px;background:#fff;border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;box-shadow:var(--shadow);
  background-image:radial-gradient(rgba(91,91,247,.12) 1.5px,transparent 2px);background-size:26px 26px}
.fc-label{position:absolute;top:18px;right:24px;font-size:20px;color:#A7A3CF;font-weight:500;direction:ltr}
.dlg-mock{width:700px;background:#EFEFF3;border-radius:6px;padding:22px 26px;font-size:19px;color:#B9B8C8;transition:all .5s;text-align:right;box-shadow:0 8px 20px -10px rgba(0,0,0,.3)}
.dm-ic{display:none;width:84px;height:84px;border-radius:24px;background:var(--badS);font-size:48px;place-items:center;margin-bottom:12px}
.dm-t{font-size:22px;font-weight:400;transition:.4s}
.dm-p2{display:none}
.dm-btns{display:flex;gap:3px;margin-top:12px;transition:.4s}
.dm-b{background:#8BC34A;color:#E8F5D8;padding:4px 12px;font-size:15px;border-radius:3px;transition:.4s}
.dlg-mock.fx-font{color:var(--ink);background:#fff;font-size:27px;line-height:1.55}
.dlg-mock.fx-font .dm-t{font-size:38px;font-weight:700;color:var(--pdd)}
.dlg-mock.fx-msg .dm-ic{display:grid}.dlg-mock.fx-msg .dm-p{display:none}.dlg-mock.fx-msg .dm-p2{display:block}
.dlg-mock.fx-color .dm-b.del{background:var(--bad);color:#fff}
.dlg-mock.fx-color .dm-b.cancel{background:#fff;color:var(--ink);border:3px solid #D5D3E8}
.dlg-mock.fx-size .dm-b{font-size:28px;padding:14px 44px;border-radius:14px;font-weight:600}
.dlg-mock.fx-space{padding:44px 48px;border-radius:30px}
.dlg-mock.fx-space .dm-btns{gap:26px;margin-top:30px}
.fix-toast{min-height:60px;font-size:30px;font-weight:600;text-align:center;max-width:900px;line-height:1.5}
.fix-toast.bad{color:var(--bad)}.fix-toast.ok{color:var(--ok)}

/* ---------- خلية عوامل تجربة المستخدم ---------- */
.honey-wrap{flex:1;display:grid;grid-template-columns:820px 1fr;gap:50px;align-items:center;min-height:0}
.honey{position:relative;width:820px;height:720px}
.hx{position:absolute;width:240px;height:277px;transform:translate(-50%,-50%);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--c);transition:transform .25s}
.hx:hover{transform:translate(-50%,-50%) scale(1.06)}
.hx-in{position:absolute;inset:7px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;transition:background .35s,color .35s}
.hx-in .hi{font-size:50px}.hx-in b{font-size:29px;font-weight:700;line-height:1.2}.hx-in small{font-size:18px;color:var(--muted);direction:ltr}
.hx.on .hx-in{background:var(--c);color:#fff}.hx.on .hx-in small{color:#fff;opacity:.85}
.hx.center{--c:var(--pdd)}
.hx.center .hx-in{background:linear-gradient(150deg,#2B2670,#17153A);color:#fff}
.hx.center .hx-in b{font-size:36px}.hx.center .hx-in small{color:#C9C5F5}
.hx.center.glow{animation:glow 1.6s infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 26px rgba(255,197,66,.9))}}
.hp{background:#fff;border-radius:30px;padding:30px 36px;box-shadow:var(--shadow);border-top:12px solid var(--c,var(--p));min-height:420px;display:flex;flex-direction:column;gap:14px}
.hp.enter{animation:pop .4s}
.hp .hp-ic{font-size:72px}
.hp h3{font-size:42px;font-weight:700;color:var(--c,var(--pd))}
.hp h3 small{font-size:24px;color:var(--muted);direction:ltr;display:inline-block;margin-right:10px;font-weight:500}
.hp p{font-size:28px;line-height:1.6}
.hp .hq{background:var(--pss);border-radius:16px;padding:10px 18px;font-size:25px;color:var(--pd);font-weight:500}
.hp-count{font-size:24px;color:var(--muted);font-weight:500}

/* ---------- المعادلة ---------- */
.eq{display:flex;align-items:center;justify-content:center;gap:34px}
.eq-c{width:330px;height:330px;border-radius:50%;background:#fff;border:6px dashed var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;transition:.4s;box-shadow:var(--shadow)}
.eq-c .ei{font-size:80px;opacity:.25;transition:.4s}
.eq-c b{font-size:38px;font-weight:700;color:transparent;transition:.4s}
.eq-c small{font-size:22px;color:transparent;direction:ltr}
.eq-c .eqq{font-size:26px;color:#B3AFD8;font-weight:500}
.eq-c.open{border-style:solid;background:color-mix(in srgb,var(--c) 14%,white);transform:scale(1.04)}
.eq-c.open .ei{opacity:1;animation:pop .4s}.eq-c.open b{color:var(--c)}.eq-c.open small{color:var(--muted)}.eq-c.open .eqq{display:none}
.eq-op{font-size:90px;font-weight:700;color:#C3BFE6}

/* ---------- تقييم المتاجر ---------- */
.audit{flex:1;display:grid;grid-template-columns:960px 1fr;gap:36px;min-height:0}
.au-shop{position:relative;border-radius:26px;overflow:hidden;border:3px solid var(--line);box-shadow:var(--shadow);background:#fff;display:flex;flex-direction:column}
.au-bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#F2F1FA;direction:ltr}
.au-bar .url{flex:1;background:#fff;border-radius:8px;padding:2px 14px;font-size:17px;color:var(--muted)}
.shop{flex:1;display:none;flex-direction:column}
.shop.on{display:flex;animation:inFade .4s}
.shop.a .s-top{display:flex;align-items:center;gap:18px;padding:16px 26px;border-bottom:2px solid #F0EFF8}
.shop.a .s-logo{font-size:28px;font-weight:700;color:var(--pdd)}
.shop.a .s-search{flex:1;height:48px;border-radius:14px;background:#F5F4FB;display:flex;align-items:center;padding:0 16px;font-size:20px;color:#A09CC7}
.shop.a .s-cart{font-size:24px;background:var(--ps);border-radius:12px;padding:6px 14px;color:var(--pd)}
.shop.a .s-nav{display:flex;gap:26px;padding:12px 26px;font-size:20px;color:var(--muted)}
.shop.a .s-nav span:first-child{color:var(--p);font-weight:600}
.shop.a .s-ban{margin:4px 26px;border-radius:22px;background:linear-gradient(120deg,#5B5BF7,#FF5FA2);color:#fff;padding:22px 30px;display:flex;align-items:center;justify-content:space-between}
.shop.a .s-ban b{font-size:34px;display:block}.shop.a .s-ban small{font-size:20px;opacity:.9}
.shop.a .s-ban span{background:#fff;color:var(--pd);border-radius:14px;padding:10px 22px;font-size:21px;font-weight:600}
.shop.a .s-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:18px 26px}
.shop.a .s-card{border:2px solid #F0EFF8;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px}
.shop.a .s-img{height:110px;border-radius:12px;background:#F5F4FB;display:grid;place-items:center;font-size:60px}
.shop.a .s-name{font-size:21px;font-weight:600}.shop.a .s-price{font-size:20px;color:var(--p);font-weight:600}.shop.a .s-rate{font-size:16px;color:var(--muted)}
.shop.a .s-add{margin-top:4px;background:var(--pdd);color:#fff;border-radius:10px;text-align:center;padding:6px;font-size:17px}
.shop.b{background:linear-gradient(90deg,#00E5FF,#FF00C8);font-family:'Comic Sans MS',cursive}
.shop.b .s-top{display:flex;gap:4px;padding:6px;font-size:13px;color:#FFFF00;background:#3A0CA3;flex-wrap:wrap}
.shop.b .s-top span{background:#F72585;padding:2px 4px}
.shop.b .s-mq{background:#FF0000;color:#FFFF00;font-size:24px;padding:8px;text-align:center;font-weight:700;animation:blink .8s infinite}
.shop.b .s-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px}
.shop.b .s-card{background:#FFF59D;padding:6px;font-size:13px;color:#BDBDBD;text-align:center}
.shop.b .s-img{font-size:44px}
.shop.b .s-add{background:#FFEB3B;color:#FFF59D;font-size:11px;padding:2px}
.shop.b .s-pop{position:absolute;left:120px;top:190px;width:400px;background:#FFF;border:6px solid #FF0000;padding:20px;text-align:center;font-size:24px;color:#FF0000;font-weight:700;box-shadow:0 0 0 2000px rgba(0,0,0,.25);transform:rotate(-2deg)}
.shop.b .s-pop small{display:block;font-size:12px;color:#ddd;margin-top:6px}
.au-side{display:flex;flex-direction:column;gap:14px;min-height:0}
.au-tabs{display:flex;gap:12px}
.au-tab{flex:1;font-size:25px;font-weight:600;padding:10px;border-radius:16px;background:#fff;border:3px solid var(--line);color:var(--muted)}
.au-tab.on{border-color:var(--p);color:var(--p);background:var(--pss)}
.au-rows{background:#fff;border-radius:24px;padding:10px 22px;box-shadow:var(--shadow-s);display:flex;flex-direction:column}
.au-row{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:2px dashed var(--line);font-size:25px;font-weight:500}
.au-row:last-child{border:0}
.au-row .an{flex:1}
.stars{display:flex;gap:2px;direction:ltr}
.star{font-size:34px;color:#DDDAF0;transition:transform .15s,color .15s;line-height:1}
.star.on{color:var(--sun)}
.star:hover{transform:scale(1.2)}
.au-score{display:flex;align-items:center;gap:20px;background:#fff;border-radius:24px;padding:14px 22px;box-shadow:var(--shadow-s)}
.ring{width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--c,var(--p)) calc(var(--v,0)*1%),var(--ps) 0);display:grid;place-items:center;flex:none;transition:--v .6s}
.ring b{width:92px;height:92px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:30px;font-weight:700;direction:ltr}
.au-verdict{font-size:25px;font-weight:600;line-height:1.5}
.au-vs{font-size:22px;color:var(--muted)}

/* ---------- مهام المجموعات ---------- */
.grp-top{display:flex;align-items:center;justify-content:space-between;gap:30px}
.grp8{gap:20px}
.grp8 .fc-ic{font-size:56px}
.grp8 .fc-title{font-size:30px}
.grp8 .fc-front{gap:4px;padding:16px}
.grp8 .fc-back{padding:20px}
.grp8 .fc-back p{font-size:24px;line-height:1.55}

/* ---------- تحدي الدقيقة ---------- */
.ch-wrap{flex:1;display:grid;grid-template-columns:440px 1fr;gap:50px;align-items:center}
.ch-left{display:flex;flex-direction:column;align-items:center;gap:24px}
.ch-score{font-size:30px;font-weight:600;background:#fff;border-radius:16px;padding:10px 32px;box-shadow:var(--shadow-s)}
.ch-score b{color:var(--ok);font-size:38px}
.ch-card{background:#fff;border-radius:34px;padding:36px 44px;min-height:360px;display:flex;flex-direction:column;justify-content:center;gap:18px;box-shadow:var(--shadow);border-top:14px solid var(--sun)}
.ch-num{font-size:25px;font-weight:500;color:var(--muted)}
.ch-q{font-size:44px;font-weight:700;line-height:1.4}
.ch-q.enter{animation:pop .4s}
.ch-a{font-size:32px;color:var(--ok);font-weight:600;opacity:0;transition:.4s;min-height:50px}
.ch-a.show{opacity:1}
.ch-btns{display:flex;gap:16px;justify-content:center;margin-top:22px}

/* ---------- خريطة المراجعة ---------- */
.map{flex:1;position:relative;min-height:0}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map line{stroke:#CFCAF3;stroke-width:3;stroke-dasharray:8 10;vector-effect:non-scaling-stroke}
.node{position:absolute;transform:translate(-50%,-50%);background:#fff;border:4px solid var(--c);color:var(--ink);border-radius:18px;padding:10px 26px;
  font-size:27px;font-weight:600;display:flex;gap:10px;align-items:center;white-space:nowrap;box-shadow:var(--shadow-s);transition:background .3s,color .3s,transform .25s}
.node:hover{transform:translate(-50%,-50%) scale(1.07)}
.node.seen{background:var(--c);color:#fff}
.map-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:560px;min-height:290px;border-radius:40px;
  background:linear-gradient(145deg,var(--p2),var(--pd));color:#fff;padding:26px 34px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:8px;box-shadow:0 0 0 16px var(--ps),var(--shadow)}
.map-center .mc-ic{font-size:56px}.map-center .mc-t{font-size:34px;font-weight:700}.map-center .mc-d{font-size:25px;font-weight:400;line-height:1.55}
.map-center.enter{animation:pop .4s}

/* ---------- لوحة الصدارة ---------- */
.lb{display:flex;flex-direction:column;gap:12px;width:1500px;align-self:center}
.lb-row{display:grid;grid-template-columns:70px 300px 1fr 90px;gap:20px;align-items:center;background:#fff;border-radius:20px;padding:8px 22px;box-shadow:var(--shadow-s);border-right:10px solid var(--c)}
.lb-pos{font-size:32px;font-weight:700;color:var(--muted);text-align:center}
.lb-name{font-size:30px;font-weight:700;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-track{height:32px;background:var(--pss);border-radius:999px;overflow:hidden}
.lb-bar{height:100%;background:var(--c);border-radius:999px;transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.lb-pts{font-size:36px;font-weight:700;text-align:center;direction:ltr}
.lb-row.win{transform:scale(1.03);box-shadow:0 0 0 5px var(--c),var(--shadow)}
.lb-row.win .lb-pos{font-size:42px}

/* ---------- الختام ---------- */
.closing{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center}
.cl-ic{font-size:130px;animation:floaty 4s ease-in-out infinite}
.cl-title{font-size:88px;font-weight:700;line-height:1.2;background:linear-gradient(120deg,var(--pd),var(--p) 40%,var(--pink) 75%,var(--coral));-webkit-background-clip:text;background-clip:text;color:transparent}
.cl-msg{font-size:36px;font-weight:400;color:var(--muted)}
.cl-tips{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:1550px}
.cl-rate{display:flex;align-items:center;gap:18px;font-size:30px;font-weight:600;background:#fff;border-radius:22px;padding:10px 20px 10px 34px;box-shadow:var(--shadow-s);margin-top:8px}
.rate{font-size:60px;transition:transform .2s;line-height:1}
.rate:hover{transform:scale(1.2) rotate(-6deg)}
.rate.on{transform:scale(1.25)}
.rate-msg{font-size:30px;font-weight:600;color:var(--pd);min-height:46px}

/* =========================================================
   3) عناصر خارج المسرح: الشريط، التحضير، الخريطة، القرعة…
   ========================================================= */
#bar{position:fixed;left:50%;bottom:2vmin;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:.6vmin;
  background:rgba(23,21,58,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-radius:2.2vmin;padding:.7vmin 1vmin;box-shadow:0 14px 34px -12px rgba(20,10,80,.6);transition:opacity .4s,transform .4s,left .45s}
#bar button{font-size:2vmin;font-weight:500;color:#E6E4FF;padding:.85vmin 1.8vmin;border-radius:1.4vmin;transition:background .2s,transform .15s;white-space:nowrap}
#bar button:hover{background:rgba(255,255,255,.12)}
#bar button:active{transform:scale(.92)}
#bar button:disabled{opacity:.3;pointer-events:none}
#bar button.on{background:rgba(255,255,255,.18)}
#bar .ib{font-size:2.6vmin;padding:.35vmin 1.1vmin}
#bar a.ib{font-size:2.6vmin;padding:.35vmin 1.1vmin;text-decoration:none;border-radius:1.4vmin}
#bar a.ib:hover{background:rgba(255,255,255,.12)}
#next{background:linear-gradient(135deg,var(--p2),var(--pink))!important;color:#fff!important;font-weight:600!important}
#counter{font-size:2vmin;font-weight:500;color:#A9A5DA;min-width:8vmin;text-align:center;direction:ltr}
#counter b{color:#fff}
#bar .sep{width:1px;height:3.2vmin;background:rgba(255,255,255,.15)}
#clapBtn.pulse{animation:pop .4s}
#hint{position:fixed;top:1.8vmin;left:1.8vmin;z-index:50;display:flex;gap:1.1vmin;font-size:1.5vmin;font-weight:500;color:#625F86;
  background:rgba(255,255,255,.88);border-radius:1.2vmin;padding:.6vmin 1.4vmin;transition:opacity .4s}
#hint kbd{font-family:inherit;background:var(--ps);color:var(--pd);border-radius:6px;padding:0 .6vmin;font-weight:700}
#progress{position:fixed;top:0;left:0;right:0;height:.55vmin;z-index:50;background:rgba(255,255,255,.3)}
#progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--coral),var(--pink),var(--p2));transition:width .6s cubic-bezier(.2,.8,.2,1);margin-right:auto;margin-left:0}
body.idle #bar{opacity:0;transform:translate(-50%,150%);pointer-events:none}
body.idle #hint{opacity:0}
body.prep-open #bar,body.prep-open #teams,body.prep-open #award{left:calc((100vw - var(--pw)) / 2)}
body.prep-open #hint{display:none}

/* لوحة النقاط */
#score{position:fixed;top:50%;left:2vmin;transform:translate(-130%,-50%);z-index:60;width:40vmin;max-height:86vh;overflow:auto;background:#fff;border-radius:3vmin;
  box-shadow:0 20px 50px -15px rgba(40,20,120,.5);padding:2.2vmin;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#score.open{transform:translate(0,-50%)}
.sc-head{display:flex;justify-content:space-between;align-items:center;font-size:2.6vmin;font-weight:700;color:var(--pdd);margin-bottom:1.5vmin}
.sc-head button{font-size:2.4vmin;color:var(--muted)}
.sc-row{display:flex;align-items:center;gap:1vmin;padding:.9vmin 1.2vmin;border-radius:1.4vmin;margin-bottom:.7vmin;background:var(--pss);border-right:.7vmin solid var(--c)}
.sc-name{flex:1;font-size:2.1vmin;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-pts{font-size:2.8vmin;font-weight:700;color:var(--c);min-width:5vmin;text-align:center}
.sc-pts.bump{animation:pop .4s}
.sc-row button{width:4.2vmin;height:4.2vmin;border-radius:1.2vmin;background:#fff;font-size:2.5vmin;font-weight:700;color:var(--pd);border:2px solid var(--line);flex:none}
.crown{font-size:2.3vmin;width:3vmin;text-align:center}
#scReset{margin-top:1vmin;width:100%;font-size:1.9vmin;font-weight:600;color:var(--muted);padding:.8vmin;border-radius:1.4vmin;border:2px dashed var(--line)}

#teams{position:fixed;top:1.4vmin;left:50%;transform:translateX(-50%);z-index:55;display:flex;gap:.6vmin;
  background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:.55vmin .7vmin;border-radius:1.6vmin;box-shadow:0 8px 24px -12px rgba(40,20,120,.45);transition:left .45s}
#teams:empty{display:none}
.tm{display:flex;align-items:center;gap:.5vmin;background:var(--c);color:#fff;border-radius:1.1vmin;padding:.3vmin 1vmin .3vmin .8vmin;font-size:1.9vmin;font-weight:600;min-width:6.5vmin;justify-content:center;transition:transform .2s;max-width:16vmin}
.tm:hover{transform:translateY(-2px)}
.tm .tm-ic{font-size:2vmin;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm b{direction:ltr}
.tm.lead{box-shadow:0 0 0 .3vmin #fff,0 0 0 .6vmin var(--c)}
.tm.bump{animation:pop .5s}
.tm.more{background:var(--pdd)}
#award{position:fixed;left:50%;bottom:10.5vmin;transform:translate(-50%,40px) scale(.9);opacity:0;pointer-events:none;z-index:70;
  background:#fff;border-radius:2.6vmin;padding:1.6vmin 2vmin;box-shadow:0 24px 60px -15px rgba(40,20,120,.55);border:2px solid var(--line);
  transition:transform .4s cubic-bezier(.2,1.4,.5,1),opacity .3s,left .45s;max-width:92vw}
#award.open{transform:translate(-50%,0) scale(1);opacity:1;pointer-events:auto}
.aw-head{display:flex;align-items:center;gap:1.2vmin;font-size:2.5vmin;font-weight:700;color:var(--pdd);margin-bottom:1.2vmin;justify-content:center}
#awPts{background:var(--ok);color:#fff;border-radius:1vmin;padding:0 1.4vmin;direction:ltr}
#awClose{margin-inline-start:auto;font-size:2.2vmin;color:var(--muted);padding:0 .6vmin}
#awBtns{display:flex;gap:1vmin;flex-wrap:wrap;justify-content:center}
#awBtns button{width:10vmin;display:flex;flex-direction:column;align-items:center;gap:.3vmin;padding:1vmin .4vmin;border-radius:1.8vmin;
  background:var(--c);color:#fff;transition:transform .2s;box-shadow:0 8px 16px -8px var(--c)}
#awBtns button:hover{transform:translateY(-5px) scale(1.05)}
#awBtns span{font-size:3.6vmin;line-height:1.1}

<script>
/* ==========================================================================
   ⭐ الجزء الأول: إعدادات الدرس — عدّلي المحتوى من هنا
   --------------------------------------------------------------------------
   • LESSON : بيانات الدرس (تُستبدل تلقائيًا ببيانات المعلمة والفصل عند فتح العرض من المكتبة).
   • SLIDES : الشرائح بالترتيب. لكل شريحة id ثابت (يُحفظ عليه التحضير والتقدم).
   • prep   : التحضير الافتراضي للشريحة (الزمن، الهدف، الاستراتيجية، إجراءات المعلمة، نشاط الطالبات، التقويم)
              ويمكن تعديله من زر 📝 داخل العرض ويُحفظ تلقائيًا لهذا الدرس.
   ========================================================================== */

const LESSON_ID = 'dd-1';
const LESSON = {
  title:    'واجهة المستخدم UI وتجربة المستخدم UX',
  fullTitle:'ماهية تصميم واجهة المستخدم UI وتجربة المستخدم UX',
  lessonNo: 'الدرس الأول',
  unit:     'الفصل السادس: تصميم واجهات الموقع الإلكتروني',
  subject:  'التصميم الرقمي',
  teacher:  'أ. ريما الهويشل',
  school:   'التربية الرقمية',
  className:'', classId:'_', students:[], groups:[], drawMode:'names', compMode:'groups', linked:false,
  teams: [
    { name:'البكسل',   icon:'🟪', color:'#5B5BF7' },
    { name:'الفرشاة',  icon:'🖌️', color:'#FF5FA2' },
    { name:'الطبقة',   icon:'🧩', color:'#13C6A3' },
    { name:'الأيقونة', icon:'✨', color:'#FF8A3D' },
    { name:'المؤشر',   icon:'🖱️', color:'#3DA5FF' },
    { name:'اللوحة',   icon:'🎨', color:'#9B5CF6' },
    { name:'الشبكة',   icon:'📐', color:'#E5A100' },
    { name:'الإطار',   icon:'🖼️', color:'#F43F5E' }
  ],
  defaultPoints: 1
};

/* أهداف الدرس (تظهر في التحضير والطباعة) */
const GOALS = {
  g0:'التهيئة وإثارة الدافعية',
  g1:'مناقشة أهمية تصميم واجهة المستخدم UI وتجربة المستخدم UX',
  g2:'التمييز بين واجهة المستخدم UI وتجربة المستخدم UX',
  g3:'تقييم تجربة المستخدم UX للمواقع الإلكترونية وفق احتياجات الناس وسهولة الاستخدام',
  g4:'التقويم الختامي وغلق الدرس'
};

const MSG = {
  correct: 'أحسنتِ! 👏 إجابة صحيحة',
  wrong:   'حاولي مرة أخرى 💜',
  short:   'أحسنتِ! 👏',
  allDone: 'ممتاز! أنجزتِ التحدي كاملًا 🎉'
};

/* 📚 الربط بالمكتبة: بيانات المعلمة والفصل والطالبات والمجموعات */
(function(){
  let L=null, S=null;
  try{ L=JSON.parse(localStorage.getItem('reema-lesson')||'null'); }catch(e){}
  try{ S=JSON.parse(localStorage.getItem('reema-library-v1')||'null'); }catch(e){}
  if(S&&S.settings){ if(S.settings.teacher) LESSON.teacher='أ. '+S.settings.teacher; if(S.settings.school) LESSON.school=S.settings.school; }
  if(!L || L.lessonId!==LESSON_ID) return;
  LESSON.linked=true;
  if(L.teacher && L.teacher.trim()!=='أ.') LESSON.teacher=L.teacher;
  if(L.school) LESSON.school=L.school;
  LESSON.className=L.className||''; LESSON.classId=L.classId||L.className||'_';
  LESSON.students=L.students||[]; LESSON.groups=(L.groups||[]).filter(g=>g.name);
  LESSON.drawMode=L.drawMode||'names'; LESSON.compMode=L.compMode||'groups';
  const icons=['🟪','🖌️','🧩','✨','🖱️','🎨','📐','🖼️','💡','🔷','🌈','⭐'];
  const pal=['#5B5BF7','#FF5FA2','#13C6A3','#FF8A3D','#3DA5FF','#9B5CF6','#E5A100','#F43F5E','#0EA5A4','#7C3AED'];
  if(LESSON.compMode==='groups' && LESSON.groups.length>=2)
    LESSON.teams=LESSON.groups.slice(0,12).map((g,i)=>({ name:g.name, icon:icons[i%icons.length], color:g.color||pal[i%pal.length], members:g.members||[] }));
  else if(LESSON.compMode==='individual' && LESSON.students.length)
    LESSON.teams=LESSON.students.map((s,i)=>({ name:s.short||s.name, full:s.name, icon:'', color:pal[i%pal.length] }));
  else if(LESSON.compMode==='none') LESSON.teams=[];
})();

/* ---------- نماذج الواجهات المستخدمة في الشرائح ---------- */
const MOCK_BAD = `<div class="bad-ui">
  <div class="bt">~*~ مرحباً بك في التطبيق ~*~</div>
  <div class="bn">ادخل البيانات المطلوبه في الخانات التاليه لكي تتمكن من الدخول الى حسابك الشخصي في التطبيق 🌟💫✨🎈</div>
  <div class="bi">user</div><div class="bi">****</div>
  <div class="bx"><span>دخول</span><span>حذف الحساب</span><span>مساعدة</span></div>
  <div class="bn">نسيت؟ | تسجيل | الشروط | الخصوصية | اتصل بنا | عن التطبيق | اللغة</div>
  <div class="bm">🔥 عرض لفترة محدودة!!! اضغط هنا 🔥</div></div>`;
const MOCK_GOOD = `<div class="good-ui">
  <div class="gl">✦</div><h4>تسجيل الدخول</h4>
  <label>البريد الإلكتروني</label><div class="gi">name@school.edu.sa</div>
  <label>كلمة المرور</label><div class="gi">••••••••</div>
  <div class="gb">دخول</div><div class="gk">نسيتِ كلمة المرور؟</div></div>`;

const SLIDES = [

  /* 1) الترحيب */

/* ---------------- 🔊 الأصوات ---------------- */
const sound = (() => {
  let ctx, master, noiseBuf;
  function ac(){
    if(!ctx){ ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createDynamicsCompressor(); master.connect(ctx.destination); }
    if(ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, t, dur, type='sine', vol=.18, toFreq){
    const c=ac(), o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(toFreq) o.frequency.exponentialRampToValueAtTime(toFreq,t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(master); o.start(t); o.stop(t+dur+.05);
  }
  function noise(){ const c=ac(); if(!noiseBuf){ noiseBuf=c.createBuffer(1,c.sampleRate*.25,c.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; } return noiseBuf; }
  function clapOne(t, vol){
    const c=ac(), src=c.createBufferSource(); src.buffer=noise();
    const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900+Math.random()*1500; bp.Q.value=.8;
    const hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=400;
    const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.003); g.gain.exponentialRampToValueAtTime(.0001,t+.07+Math.random()*.06);
    src.connect(hp).connect(bp).connect(g).connect(master); src.start(t, Math.random()*.1); src.stop(t+.2);
  }
  const safe = f => function(){ try{ f.apply(null,arguments); }catch(e){} };
  return {
    ac:safe(ac),
    clap:safe(()=>{ const c=ac(), now=c.currentTime+.02; for(let p=0;p<7;p++){ let t=now+Math.random()*.18; const period=.15+Math.random()*.09; while(t<now+1.8){ const fade=Math.max(.1,1-(t-now)/2); clapOne(t,.9*fade*(.55+Math.random()*.45)); t+=period*(.85+Math.random()*.3); } } }),
    success:safe(()=>{ const t=ac().currentTime; [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,t+i*.09,.35,'triangle',.2)); tone(2093,t+.38,.5,'sine',.07); }),
    wrong:safe(()=>{ const t=ac().currentTime; tone(392,t,.2,'sine',.13); tone(311,t+.16,.32,'sine',.13); }),
    ding:safe(()=>{ const t=ac().currentTime; tone(880,t,.25,'sine',.16); tone(1320,t+.06,.3,'sine',.1); }),
    pop:safe(()=>{ const t=ac().currentTime; tone(420,t,.12,'sine',.18,980); }),
    flip:safe(()=>{ const t=ac().currentTime; tone(700,t,.14,'triangle',.08,320); }),
    tick:safe(()=>{ const t=ac().currentTime; tone(1200,t,.04,'square',.04); }),
    key:safe(()=>{ const t=ac().currentTime; tone(1800+Math.random()*400,t,.03,'square',.025); }),
    bell:safe(()=>{ const t=ac().currentTime; [0,.45,.9].forEach(d=>{ tone(988,t+d,.9,'sine',.2); tone(1480,t+d,.6,'sine',.08); }); })
  };
})();

const confetti = (() => {
  const cv=$('#fx'), cx=cv.getContext('2d'); let parts=[], running=false, dpr=1;
  const size=()=>{ dpr=window.devicePixelRatio||1; cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; };
  size(); addEventListener('resize',size);
  const colors=['#5B5BF7','#7B6CFF','#FF5FA2','#FF6B57','#13C6A3','#FFC542','#3DA5FF'];
  function add(x,y,vx,vy){ parts.push({x,y,vx,vy,s:7+Math.random()*9,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:colors[Math.random()*colors.length|0],life:0,max:110+Math.random()*70,shape:Math.random()*3|0}); }
  function loop(){
    running=true; cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,innerWidth,innerHeight);
    parts=parts.filter(p=>p.life<p.max && p.y<innerHeight+40);
    for(const p of parts){
      p.life++; p.vy+=.32; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      cx.save(); cx.globalAlpha=Math.min(1,(p.max-p.life)/30); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c;
      if(p.shape===0){ cx.beginPath(); cx.arc(0,0,p.s/2,0,7); cx.fill(); }
      else if(p.shape===1){ cx.beginPath(); cx.moveTo(0,-p.s/2); cx.lineTo(p.s/2,p.s/2); cx.lineTo(-p.s/2,p.s/2); cx.fill(); }
      else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
      cx.restore();
    }
    if(parts.length) requestAnimationFrame(loop); else { running=false; cx.clearRect(0,0,innerWidth,innerHeight); }
  }
  return {
    burst(x,y,n=90){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=4+Math.random()*11; add(x,y,Math.cos(a)*v,Math.sin(a)*v-6); } if(!running) loop(); },
    rain(n=160){ for(let i=0;i<n;i++) add(Math.random()*innerWidth,-20-Math.random()*300,(Math.random()-.5)*4,Math.random()*3); if(!running) loop(); }
  };
})();

    const s=document.createElement('span'); s.className='clap-fly'; s.textContent=['👏','🎨','✨'][i%3];
    s.style.left=(8+Math.random()*84)+'vw'; s.style.fontSize=(3+Math.random()*4)+'vmin';
    s.style.setProperty('--dx',((Math.random()-.5)*30)+'vmin'); s.style.setProperty('--rot',((Math.random()-.5)*60)+'deg');
    s.style.animationDelay=(i*70)+'ms'; document.body.appendChild(s); setTimeout(()=>s.remove(),3400);

/* ---------------- ⏱️ المؤقت ---------------- */
class Countdown{
  constructor(sec,onTick,onEnd){ this.total=sec; this.left=sec; this.onTick=onTick; this.onEnd=onEnd; this.id=null; }
  get running(){ return !!this.id; }
  start(){ if(this.id||this.left<=0) return; this.id=setInterval(()=>{ this.left--; this.onTick(this.left); if(this.left<=0){ this.stop(); this.onEnd&&this.onEnd(); } },1000); }
  stop(){ clearInterval(this.id); this.id=null; }
  reset(){ this.stop(); this.left=this.total; this.onTick(this.left); }
}
function mountTimer(slot, sec, opts={}){
  const C=2*Math.PI*52;
  slot.innerHTML=`<div class="timer-box ${opts.big?'big':''}"><div class="timer"><svg viewBox="0 0 120 120"><circle class="tr-bg" cx="60" cy="60" r="52"/><circle class="tr-fg" cx="60" cy="60" r="52"/></svg><div class="tr-txt">${fmt(sec)}</div></div>
    <div class="tr-btns"><button class="tbtn t-play" title="تشغيل/إيقاف">▶</button><button class="tbtn t-reset" title="إعادة">↺</button></div></div>`;
  const box=$('.timer-box',slot), fg=$('.tr-fg',slot), txt=$('.tr-txt',slot), play=$('.t-play',slot);
  fg.style.strokeDasharray=C; fg.style.strokeDashoffset=0;
  const draw=l=>{ txt.textContent=fmt(l); fg.style.strokeDashoffset=C*(1-l/sec); box.classList.toggle('warn',l<=10&&l>0); };
  const cd=new Countdown(sec, l=>{ draw(l); if(l<=5&&l>0) sound.tick(); }, ()=>{ box.classList.add('end'); play.textContent='▶'; sound.bell(); opts.onEnd&&opts.onEnd(); });
  play.onclick=()=>{ sound.ac(); if(cd.running){ cd.stop(); play.textContent='▶'; } else { if(cd.left<=0){ cd.reset(); box.classList.remove('end'); } cd.start(); play.textContent='⏸'; opts.onStart&&opts.onStart(); } };
  $('.t-reset',slot).onclick=()=>{ cd.reset(); box.classList.remove('end','warn'); play.textContent='▶'; opts.onReset&&opts.onReset(); };
  return cd;
}

R.brainstorm = {
  html:s=>`<div class="bs">
    <div class="bs-side">
      <div class="bs-prompt rv">${s.prompt}</div>
      <div class="bs-input rv"><input type="text" placeholder="اكتبي فكرة الطالبة هنا…" maxlength="28"><button class="btn primary bs-add">＋</button></div>
      <div class="bs-btns rv"><button class="btn ghost bs-sug">💡 فكرة مقترحة</button><button class="btn ghost bs-clear">🧹 مسح</button></div>
      <div class="timer-slot rv"></div>
    </div>
    <div class="bs-area rv"><div class="bs-center">${s.center}</div></div></div>`,
  init:(sec,s)=>{
    const area=$('.bs-area',sec), inp=$('input',sec); let n=0, sug=0;
    const add=t=>{
      t=(t||'').trim(); if(!t) return;
      const outer=n%18<10, k=outer? n%18 : n%18-10;
      const ang=(outer? k*36 : k*45+22)*Math.PI/180 - Math.PI/2;
      const rx=outer?39:25, ry=outer?40:28, jit=n>=18?4:0;
      const b=document.createElement('div'); b.className='bubble'; b.textContent=t;
      b.style.setProperty('--c',PALETTE[n%PALETTE.length]);
      b.style.left=(50+Math.cos(ang)*rx+jit)+'%'; b.style.top=(50+Math.sin(ang)*ry+jit)+'%';
      area.appendChild(b); n++; sound.pop();
    };
    $('.bs-add',sec).onclick=()=>{ add(inp.value); inp.value=''; inp.focus(); };
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ add(inp.value); inp.value=''; } });

};

R.match = {
  html:s=>{ const order=shuffle(s.pairs.map((_,k)=>k));
    return `<p class="lead rv">${s.prompt}</p>
    <div class="match rv"><div class="m-col">${s.pairs.map((p,k)=>`<button class="m-item term" data-k="${k}">${p.a}</button>`).join('')}</div>
      <div class="m-col">${order.map(k=>`<button class="m-item def" data-k="${k}">${s.pairs[k].b}</button>`).join('')}</div></div>`; },
  init:(sec,s)=>{
    let selT=null, selD=null, done=0; const lead=$('.lead',sec);
    const tryPair=()=>{
      if(!selT||!selD) return;
      const a=selT, b=selD; selT=selD=null; a.classList.remove('sel'); b.classList.remove('sel');
      if(a.dataset.k===b.dataset.k){
        done++; const c=PALETTE[(done-1)%PALETTE.length];
        [a,b].forEach(x=>{ x.classList.add('matched'); x.style.setProperty('--mc',c); x.dataset.badge=done; });
        if(done===s.pairs.length){ lead.innerHTML='🎉 '+MSG.allDone; lead.classList.add('ok-text'); celebrate($('.match',sec)); } else sound.ding();
      } else { shake(a); shake(b); sound.wrong(); }
    };
    const pick=(el,isTerm)=>{
      if(isTerm){ if(selT) selT.classList.remove('sel'); selT = selT===el?null:el; selT&&selT.classList.add('sel'); }
      else      { if(selD) selD.classList.remove('sel'); selD = selD===el?null:el; selD&&selD.classList.add('sel'); }
      tryPair();
    };
    $$('.term',sec).forEach(t=>t.onclick=()=>pick(t,true));
    $$('.def',sec).forEach(d=>d.onclick=()=>pick(d,false));
  }
};

  if(LESSON.groups.length) return LESSON.groups.slice(0,8).map((g,i)=>({ name:g.name, color:g.color||PALETTE[i%8], icon:(LESSON.teams[i]&&LESSON.teams[i].icon)||'🧩', members:g.members||[] }));
  if(LESSON.compMode==='groups' && LESSON.teams.length) return LESSON.teams.slice(0,8);
  return [
    { name:'البكسل',icon:'🟪',color:'#5B5BF7' },{ name:'الفرشاة',icon:'🖌️',color:'#FF5FA2' },{ name:'الطبقة',icon:'🧩',color:'#13C6A3' },{ name:'الأيقونة',icon:'✨',color:'#FF8A3D' },
    { name:'المؤشر',icon:'🖱️',color:'#3DA5FF' },{ name:'اللوحة',icon:'🎨',color:'#9B5CF6' },{ name:'الشبكة',icon:'📐',color:'#E5A100' },{ name:'الإطار',icon:'🖼️',color:'#F43F5E' }];
}
R.groups = {
  html:s=>{ const T=taskTeams(), n=Math.min(4,T.length);
    return `<div class="grp-top rv"><p class="lead">${s.prompt}</p><div class="timer-slot"></div></div>
    <div class="cards grp8 rv" style="--n:${n};--h:${T.length>4?255:420}px">${T.map((g,k)=>`<div class="fc-wrap"><button class="fc" style="--c:${g.color}">
      <div class="fc-face fc-front"><div class="fc-ic">${g.icon}</div><div class="fc-title">${esc(g.name)}</div>${g.members&&g.members.length?`<div class="fc-mem">${g.members.map(esc).join('، ')}</div>`:''}<div class="fc-hint">اضغطي لكشف المهمة 🎯</div></div>
      <div class="fc-face fc-back"><p>${(s.tasks||[])[k]||'مهمة حرة تحددها المعلمة'}</p></div></button></div>`).join('')}</div>`; },
  init:(sec,s)=>{ flipInit(sec); mountTimer($('.timer-slot',sec), s.seconds||180, { onEnd:()=>showAward() }); }
};

R.leaderboard = {
  html:()=>`<div class="lb rv"></div><div class="center-row rv"><button class="btn primary lg lb-go">🥁 أعلني الفائز</button></div>`,
  draw(sec, reveal){
    if(!COMP){ $('.lb',sec).innerHTML=''; return; }
    const max=Math.max(1,...scores), top=Math.max(...scores);
    const order=LESSON.teams.map((t,k)=>k).sort((a,b)=>scores[b]-scores[a]).slice(0,8);
    $('.lb',sec).innerHTML=order.map((k,pos)=>{ const t=LESSON.teams[k], win=reveal&&top>0&&scores[k]===top;
      return `<div class="lb-row ${win?'win':''}" style="--c:${t.color}"><span class="lb-pos">${win?'👑':pos+1}</span><span class="lb-name">${t.icon} ${esc(t.name)}</span>
        <div class="lb-track"><div class="lb-bar" style="width:${reveal?Math.max(4,scores[k]/max*100):4}%"></div></div><span class="lb-pts">${reveal?scores[k]:'؟'}</span></div>`; }).join('');
  },
  init:sec=>{ $('.lb-go',sec).onclick=()=>{
    R.leaderboard.draw(sec,true); sound.success(); setTimeout(()=>confetti.rain(220),300);
    const w=$$('.lb-row.win .lb-name',sec); if(w.length) $('.lb-go',sec).textContent='🏆 الفائز: '+w.map(x=>x.textContent).join(' و ');
  }; },
  enter:sec=>{ R.leaderboard.draw(sec,false); $('.lb-go',sec).textContent='🥁 أعلني الفائز'; }
};

R.challenge = {
  html:s=>`<div class="ch-wrap">
    <div class="ch-left rv"><div class="timer-slot"></div><div class="ch-score">✅ إجابات صحيحة: <b>0</b></div></div>
    <div class="rv"><div class="ch-card"><div class="ch-num"></div><p class="ch-q"></p><div class="ch-a"></div></div>
      <div class="ch-btns"><button class="btn ghost ch-show">👀 الإجابة</button><button class="btn ok ch-plus">✓ صحيحة +1</button><button class="btn primary ch-next">التالي ⬅</button></div></div></div>`,
  init:(sec,s)=>{
    let i=0, score=0; const q=$('.ch-q',sec), a=$('.ch-a',sec), num=$('.ch-num',sec), sc=$('.ch-score b',sec), plus=$('.ch-plus',sec);
    const show=()=>{ num.textContent=`السؤال ${i+1} من ${s.questions.length}`; q.textContent=s.questions[i].q; a.textContent='💡 '+s.questions[i].a; a.classList.remove('show'); plus.disabled=false; retrigger(q,'enter'); };
    show();
    $('.ch-show',sec).onclick=()=>{ a.classList.add('show'); sound.pop(); };
    plus.onclick=()=>{ score++; sc.textContent=score; plus.disabled=true; retrigger(sc,'shake'); sound.ding(); showAward(1); };
    $('.ch-next',sec).onclick=()=>{ i=(i+1)%s.questions.length; show(); };
    mountTimer($('.timer-slot',sec), s.seconds||60, { big:true,
      onEnd:()=>{ num.textContent='⏰ انتهى الوقت!'; q.textContent=`النتيجة: ${score} إجابات صحيحة`; a.classList.remove('show'); if(score>0) confetti.burst(innerWidth/2,innerHeight/2,120); },
      onReset:()=>{ score=0; sc.textContent=0; i=0; show(); } });

R.review = {
  html:s=>{
    const n=s.nodes.length, pts=s.nodes.map((_,k)=>{ const a=(k*360/n-90)*Math.PI/180; return [50+Math.cos(a)*40, 50+Math.sin(a)*40]; });
    return `<div class="map rv">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none">${pts.map(p=>`<line x1="50" y1="50" x2="${p[0]}" y2="${p[1]}"/>`).join('')}</svg>
      ${s.nodes.map((nd,k)=>`<button class="node" data-k="${k}" style="left:${pts[k][0]}%;top:${pts[k][1]}%;--c:${nd.color}">${nd.icon} ${nd.t}</button>`).join('')}
      <div class="map-center"><div class="mc-ic">${s.center.icon}</div><div class="mc-t">${s.center.t}</div><div class="mc-d">${s.center.d}</div></div></div>`;
  },
  init:(sec,s)=>{
    const c=$('.map-center',sec);
    $$('.node',sec).forEach(nb=>nb.onclick=()=>{
      const nd=s.nodes[+nb.dataset.k]; nb.classList.add('seen');

      if(!$$('.node:not(.seen)',sec).length) setTimeout(()=>celebrate(c,true),300);

R.closing = {
  html:s=>`<div class="closing"><div class="cl-ic rv">${s.icon||'🎨'}</div><h1 class="cl-title rv">${s.title}</h1><p class="cl-msg rv">${s.message}</p>
    <div class="cl-tips rv">${s.tips.map(t=>`<span class="chip lg">${t}</span>`).join('')}</div>

    <div class="rate-msg"></div></div>`,
  init:(sec,s)=>$$('.rate',sec).forEach(b=>b.onclick=()=>{
    $$('.rate',sec).forEach(x=>x.classList.remove('on')); b.classList.add('on');
    const m=$('.rate-msg',sec); m.textContent=s.rating[+b.dataset.k].m; retrigger(m,'shake'); sound.ding();

/* محاكي مخطط سير العمل: بناء خطوة بخطوة + تشغيل المسارات */
R.wfsim = {
  html:(s,idx)=>{
    const D={ diamond:[230,116] }, sz=n=>n.w? [n.w,n.h] : (D[n.shape]||[210,74]);
    const pts=e=>e.pts.map((p,k)=>(k?'L':'M')+p[0]+' '+p[1]).join(' ');
    return `<div class="wf-wrap">
      <div class="wf-side rv">
        ${s.mode==='build'?`<div class="wf-head"><span class="wf-cnt"></span><div class="wf-bar"><i></i></div></div>
        <div class="wf-ask"></div>
        <div class="wf-pal">${['oval','rect','diamond','doc','para'].map(k=>`<button class="wf-pb" data-s="${k}" style="--c:${SHAPES[k].c}">${shapeSVG(k,74,38,{sw:2.5,rx:5})}<span>${SHAPES[k].name}</span></button>`).join('')}</div>
        <div class="wf-routes"></div>
        <div class="wf-fb"></div>`:''}
        <div class="wf-sim${s.mode==='build'?'':' on'}"><div class="wf-sim-t">${s.simTitle||'▶ شغّلي المحاكاة: اختاري مسارًا'}</div>
          ${s.scenarios.map((sc,k)=>`<button class="wf-sb" data-k="${k}">${sc.name}</button>`).join('')}
          <div class="wf-now">📍 اختاري مسارًا لتتبّع رحلة سير العمل خطوة بخطوة</div>
          ${s.questions?`<div class="wf-qs">${s.questions.map(q=>`<button class="wf-qq">❓ ${q.q}<span>💡 ${q.a}</span></button>`).join('')}</div>`:''}
        </div>
        <div class="wf-ctrl">${s.mode==='build'?`<button class="btn ghost wf-solve">⏭ الحل كاملًا</button>`:''}<button class="btn ghost wf-reset">↺ إعادة</button></div>
      </div>
      <div class="wf-canvas rv">
        <svg class="wf-edges" viewBox="0 0 1200 650"><defs>
          <marker id="wfA${idx}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/></marker>
          <marker id="wfB${idx}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#F43F5E"/></marker></defs>
          ${s.edges.map((e,k)=>`<path class="wf-e" data-k="${k}" d="${pts(e)}" marker-end="url(#wfA${idx})"/>`).join('')}</svg>
        ${s.edges.map((e,k)=>e.label?`<span class="wf-lbl ${e.label==='نعم'?'yes':'no'}" data-k="${k}" style="left:${e.lx}px;top:${e.ly}px">${e.label}</span>`:'').join('')}
        ${Object.entries(s.nodes).map(([id,n])=>{ const [w,h]=sz(n); return `<div class="wf-node" data-id="${id}" data-shape="${n.shape}" style="left:${n.x-w/2}px;top:${n.y-h/2}px;width:${w}px;height:${h}px"><div class="wf-shape">${shapeSVG(n.shape,w,h)}</div><span class="wf-t">${n.t}</span><b class="wf-q">؟</b></div>`; }).join('')}
        ${legendHTML()}
        <div class="wf-done">✅ اكتمل المخطط</div>
      </div></div>`;
  },
  init:(sec,s,idx)=>{
    const canvas=$('.wf-canvas',sec), node=id=>$(`.wf-node[data-id="${id}"]`,sec);
    const paths=$$('.wf-e',sec), lbl=k=>$(`.wf-lbl[data-k="${k}"]`,sec);
    const placed={}, solved={}; let st=0, simT=null, building=s.mode==='build';
    const now=$('.wf-now',sec), simBox=$('.wf-sim',sec);
    const drawEdges=()=>s.edges.forEach((e,k)=>{ const v=placed[e.from]&&placed[e.to]&&(!e.gate||solved[e.gate]); paths[k].classList.toggle('show',!!v); const l=lbl(k); l&&l.classList.toggle('show',!!v); });
    const place=(id,anim)=>{ placed[id]=true; const n=node(id); n.classList.remove('ghost','focus'); n.classList.add('placed'); if(anim) retrigger(n,'enter'); };
    const stopSim=()=>{ clearInterval(simT); simT=null; $$('.wf-node',sec).forEach(n=>n.classList.remove('hot','visited')); paths.forEach(p=>{ p.classList.remove('flow'); p.setAttribute('marker-end',`url(#wfA${idx})`); }); $$('.wf-sb',sec).forEach(b=>b.classList.remove('run')); };
    const finish=award=>{
      building=false; $$('.wf-node',sec).forEach(n=>n.classList.remove('ghost','focus'));
      if(s.mode==='build'){
        $('.wf-ask',sec).innerHTML='🎉 <b>اكتمل المخطط!</b> تتبّعي المسارات 👇'; retrigger($('.wf-ask',sec),'enter'); $('.wf-head',sec).style.display='none';
        $('.wf-pal',sec).style.display='none'; $('.wf-routes',sec).innerHTML=''; $('.wf-fb',sec).textContent='';
        $('.wf-cnt',sec).textContent=`${s.steps.length} / ${s.steps.length}`; $('.wf-bar i',sec).style.width='100%';
      }
      simBox.classList.add('on'); $('.wf-done',sec).classList.add('on');
      award ? celebrate(canvas) : sound.success();
    };
    const render=()=>{
      if(!building) return;
      $$('.wf-node',sec).forEach(n=>n.classList.remove('ghost','focus'));
      if(st>=s.steps.length) return finish(true);
      const S=s.steps[st], ask=$('.wf-ask',sec), pal=$('.wf-pal',sec), routes=$('.wf-routes',sec);
      $('.wf-cnt',sec).textContent=`الخطوة ${st+1} / ${s.steps.length}`; $('.wf-bar i',sec).style.width=(st/s.steps.length*100)+'%';
      if(S.route){
        node(S.node).classList.add('focus'); pal.style.display='none';
        ask.innerHTML=`🔀 ${S.ask}`;
        routes.innerHTML=S.options.map((o,k)=>`<button class="wf-rb" data-k="${k}">${o.t}</button>`).join('');
        $$('.wf-rb',routes).forEach(b=>b.onclick=()=>{
          const o=S.options[+b.dataset.k], fb=$('.wf-fb',sec);
          if(o.ok){ solved[S.route]=true; drawEdges(); fb.className='wf-fb ok'; fb.innerHTML='✓ '+(S.why||MSG.short); retrigger(fb,'pop'); sound.ding(); st++; render(); }
          else { shake(b); sound.wrong(); fb.className='wf-fb bad'; fb.innerHTML='✖ '+(o.hint||MSG.wrong); retrigger(fb,'pop'); }
        });
      } else {
        node(S.node).classList.add('ghost'); pal.style.display=''; routes.innerHTML='';
        ask.innerHTML=`${S.ask}<span class="wf-quote">«${s.nodes[S.node].t}»</span>`;
      }
      retrigger(ask,'enter');
    };
    $$('.wf-pb',sec).forEach(b=>b.onclick=()=>{
      if(!building) return; const S=s.steps[st]; if(!S||S.route) return;
      const fb=$('.wf-fb',sec), want=s.nodes[S.node].shape, got=b.dataset.s;
      if(got===want){ place(S.node,true); drawEdges(); fb.className='wf-fb ok'; fb.innerHTML=`✓ صحيح: <b>${SHAPES[want].name}</b> — ${S.why||''}`; retrigger(fb,'pop'); sound.ding(); st++; render(); }
      else { shake(b); sound.wrong(); fb.className='wf-fb bad'; fb.innerHTML=`✖ هذا رمز «${SHAPES[got].name}»… ${S.hint||'فكّري في نوع الخطوة'}`; retrigger(fb,'pop'); }
    });
    const runPath=k=>{
      stopSim(); const sc=s.scenarios[k], path=sc.path; let i=0;
      $$('.wf-sb',sec)[k].classList.add('run'); sound.ac();
      const tick=()=>{
        if(i>0) node(path[i-1]).classList.replace('hot','visited')||node(path[i-1]).classList.add('visited');
        if(i>=path.length){ clearInterval(simT); simT=null; now.innerHTML=`🏁 <b>انتهى المسار:</b> ${sc.end||'وصلنا إلى النهاية'}`; sound.success(); return; }
        const id=path[i], n=node(id); n.classList.remove('visited'); n.classList.add('hot');
        let extra='';
        if(i>0){ const ek=s.edges.findIndex(e=>e.from===path[i-1]&&e.to===id); if(ek>=0){ paths[ek].classList.add('flow'); paths[ek].setAttribute('marker-end',`url(#wfB${idx})`); if(s.edges[ek].label) extra=` <b>(${s.edges[ek].label})</b>`; } }
        now.innerHTML=`📍 الخطوة ${i+1}: <b>${s.nodes[id].t}</b>${extra}`; sound.tick(); i++;
      };
      tick(); simT=setInterval(tick, s.speed||1100);
    };
    $$('.wf-sb',sec).forEach(b=>b.onclick=()=>runPath(+b.dataset.k));
    $$('.wf-qq',sec).forEach(q=>q.onclick=()=>{ q.classList.toggle('open'); sound.pop(); });
    const reset=()=>{
      stopSim(); Object.keys(placed).forEach(k=>delete placed[k]); Object.keys(solved).forEach(k=>delete solved[k]);
      $('.wf-done',sec).classList.remove('on');
      if(s.mode==='build'){
        $$('.wf-node',sec).forEach(n=>n.classList.remove('placed','enter','ghost','focus')); st=0; building=true;
        simBox.classList.remove('on'); $('.wf-fb',sec).textContent=''; $('.wf-pal',sec).style.display=''; $('.wf-head',sec).style.display=''; drawEdges(); render();
      } else { Object.keys(s.nodes).forEach(id=>place(id)); s.edges.forEach(e=>e.gate&&(solved[e.gate]=true)); drawEdges(); now.innerHTML='📍 اختاري مسارًا لتتبّع رحلة سير العمل خطوة بخطوة'; }
    };
    $('.wf-reset',sec).onclick=reset;
    const solve=$('.wf-solve',sec);
    if(solve) solve.onclick=()=>{ if(!building) return; stopSim(); Object.keys(s.nodes).forEach(id=>place(id,true)); s.steps.forEach(x=>x.route&&(solved[x.route]=true)); drawEdges(); finish(false); };
    reset();
  },
  enter:()=>{}
};

/* ---------------- 🧱 بناء الشرائح ---------------- */
const stage=$('#stage'); const slides=[]; let current=0;
const ANIMS=['slide','fade','zoom'];
SLIDES.forEach((s,i)=>{
  const r=R[s.type]; if(!r){ console.warn('نوع شريحة غير معروف:',s.type); return; }
  const sec=document.createElement('section'); sec.className='slide t-'+s.type;
  const head=(s.tag?`<div class="tag rv">${s.tag}</div>`:'')+(s.title&&!['title','closing','section'].includes(s.type)?`<h2 class="title rv">${s.title}</h2>`:'');
  sec.innerHTML=`<div class="slide-inner">${head}<div class="content">${r.html(s,i)}</div></div>`;
  stage.appendChild(sec);
  $$('.rv',sec).forEach((el,k)=>el.style.setProperty('--i',Math.min(k,9)));
  r.init&&r.init(sec,s,i);
  slides.push({el:sec,cfg:s,r});
});
$('#brand').textContent=`${LESSON.lessonNo}: ${LESSON.title}`;

/* ---------------- 🧭 التنقل ---------------- */
function go(n){
  if(n<0||n>=slides.length) return;
  const dir=n>=current?1:-1, old=slides[current].el, nw=slides[n].el;
  if(n!==current){ old.classList.remove('active'); retrigger(old,'leaving'); setTimeout(()=>old.classList.remove('leaving'),460); }
  const anim=slides[n].cfg.anim||ANIMS[n%ANIMS.length];
  nw.classList.remove('in-fade','in-zoom','in-slide-next','in-slide-prev','active'); void nw.offsetWidth;
  nw.classList.add('active','in-'+(anim==='slide'?(dir>0?'slide-next':'slide-prev'):anim));
  current=n; updateUI();
  slides[n].r.enter&&slides[n].r.enter(nw,slides[n].cfg);
}
const next=()=>go(current+1), prev=()=>go(current-1);
function updateUI(){
  $('#counter').innerHTML=`<b>${current+1}</b> / ${slides.length}`;
  $('#pgnum').textContent=`${current+1} / ${slides.length}`;
  $('#progress i').style.width=((current+1)/slides.length*100)+'%';
  $('#prev').disabled=current===0; $('#next').disabled=current===slides.length-1;
}

/* ---------------- 📐 ملاءمة الشاشة 16:9 ---------------- */
function fit(){ const s=Math.min(innerWidth/1920, innerHeight/1080); stage.style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener('resize',fit); fit();

/* ---------------- ⌨️ لوحة المفاتيح ---------------- */
document.addEventListener('keydown',e=>{
  if($('#drawOv').classList.contains('open')){
    if(e.key===' '||e.code==='Space'||e.key==='Enter'){ e.preventDefault(); runDraw(); }
    else if(e.key==='Escape'){ closeDraw(); }
    return;
  }
  if(e.target.matches('input,textarea')){ if(e.key==='Escape') e.target.blur(); return; }
  if(e.key==='ق'||e.code==='KeyR'){ e.preventDefault(); openDraw(CLS.drawMode); return; }
  const k=e.key;
  if(k==='ArrowRight'||k===' '||e.code==='Space'||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='ArrowUp'||k==='ArrowDown'){ e.preventDefault(); }
  else if(k==='ت'||e.code==='KeyF'){ e.preventDefault(); clap(); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(slides.length-1); }
});
document.addEventListener('keyup',e=>{ if((e.key===' '||e.code==='Space')&&!e.target.matches('input,textarea')) e.preventDefault(); });
// إزالة التركيز عن الأزرار بعد الضغط حتى لا يضغطها زر Space مرة أخرى
document.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) setTimeout(()=>b.blur(),0); });
addEventListener('wheel',e=>e.preventDefault(),{passive:false});

/* سحب باللمس (للسبورة الذكية) */
let tx=null, ty=null;
stage.addEventListener('touchstart',e=>{ if(e.target.closest('input')) return; tx=e.touches[0].clientX; ty=e.touches[0].clientY; },{passive:true});
stage.addEventListener('touchend',e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty; tx=null;
  if(Math.abs(dx)>140&&Math.abs(dy)<80){ dx<0?next():prev(); } });

/* ---------------- 🎛️ أزرار الشريط ---------------- */
$('#next').onclick=next; $('#prev').onclick=prev; $('#clapBtn').onclick=clap;
$('#fsBtn').onclick=()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); else document.exitFullscreen(); };

/* إخفاء الشريط تلقائيًا عند عدم تحريك الماوس */
let idleT;
function wake(){ document.body.classList.remove('idle'); clearTimeout(idleT);
  idleT=setTimeout(()=>{ if(!$('#bar').matches(':hover')&&!$('#score').classList.contains('open')) document.body.classList.add('idle'); },2800); }
['mousemove','mousedown','touchstart'].forEach(ev=>addEventListener(ev,wake,{passive:true})); wake();

/* ---------------- 🏆 تنافس المجموعات ---------------- */
const scores=LESSON.teams.map(()=>0);
function addPoints(k,d){
  scores[k]=Math.max(0,scores[k]+d); drawScores(k);
  const chip=$(`#teams .tm[data-k="${k}"]`); chip&&retrigger(chip,'bump');
}
function drawScores(bumpIdx){
  const max=Math.max(...scores);
  // اللوحة الجانبية الكاملة
  $('#scList').innerHTML=LESSON.teams.map((t,k)=>`<div class="sc-row" style="--c:${t.color}"><span class="crown">${max>0&&scores[k]===max?'👑':''}</span>
    <span class="sc-name">${t.icon} ${t.name}</span><button data-k="${k}" data-d="-1">−</button><span class="sc-pts ${k===bumpIdx?'bump':''}">${scores[k]}</span><button data-k="${k}" data-d="1">＋</button></div>`).join('');
  // الشريط العلوي الدائم
  $('#teams').innerHTML=LESSON.teams.map((t,k)=>`<button class="tm ${max>0&&scores[k]===max?'lead':''}" data-k="${k}" style="--c:${t.color}" title="${t.name}">
    <span class="tm-ic">${max>0&&scores[k]===max?'👑':t.icon}</span><b>${scores[k]}</b></button>`).join('');
}
$('#scList').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const d=+b.dataset.d; addPoints(+b.dataset.k,d); d>0?sound.ding():sound.pop(); });
$('#teams').addEventListener('click',()=>$('#score').classList.add('open'));
$('#scoreBtn').onclick=()=>$('#score').classList.toggle('open');
$('#scClose').onclick=()=>$('#score').classList.remove('open');
$('#scReset').onclick=()=>{ if(confirm('تصفير نقاط جميع المجموعات؟')){ scores.fill(0); drawScores(); } };
drawScores();

/* نافذة «أي مجموعة أجابت؟» — تظهر بعد كل إجابة صحيحة */
let awardT;
function showAward(pts){
  pts = pts || slides[current].cfg.points || LESSON.defaultPoints || 1;
  const box=$('#award');
  $('#awPts').textContent='+'+pts;
  $('#awBtns').innerHTML=LESSON.teams.map((t,k)=>`<button data-k="${k}" style="--c:${t.color}" title="${t.name}"><span>${t.icon}</span><small>${t.name}</small></button>`).join('');
  $$('#awBtns button').forEach(b=>b.onclick=()=>{
    addPoints(+b.dataset.k,pts); sound.ding();
    const r=b.getBoundingClientRect(); confetti.burst(r.left+r.width/2,r.top,30);
    box.classList.remove('open');
  });
  box.classList.add('open'); clearTimeout(awardT); awardT=setTimeout(()=>box.classList.remove('open'),15000);
}
$('#awClose').onclick=()=>$('#award').classList.remove('open');

/* ---------------- 🎲 القرعة (من الحاضرات فقط) ---------------- */
function applyTeams(){
  LESSON.teams=teamsFromClass();
  scores.length=0; LESSON.teams.forEach(()=>scores.push(0));
  drawScores();
  $$('.hero-teams').forEach(h=>h.innerHTML=heroTeamsInner());
  $$('.hero-cls').forEach(h=>h.textContent='👩‍🎓 '+(clsCur()?clsCur().name:''));
}
const DRAW={ mode:'names', drawn:{names:[],groups:[]}, busy:false };
function drawPool(){
  const ab=clsAbsent();
  if(DRAW.mode==='groups') return clsGroups().map((g,i)=>({id:g.id,label:`${TEAM_ICONS[i%TEAM_ICONS.length]} ${g.name}`,full:g.members.filter(m=>!ab.includes(m)).map(m=>shortName(clsName(m))).join('، ')})).filter(g=>g.full);
  const c=clsCur(); return c?c.students.filter(s=>!ab.includes(s.id)).map(s=>({id:s.id,label:shortName(s.name),full:s.name})):[];
}
function drawPaint(){
  const ov=$('#drawOv'), pool=drawPool(), used=DRAW.drawn[DRAW.mode].filter(id=>pool.some(p=>p.id===id));
  $$('.dr-modes button',ov).forEach(b=>b.classList.toggle('on',b.dataset.m===DRAW.mode));
  $('.dr-modes [data-m="groups"]',ov).disabled=clsGroups().length<2;
  $('.dr-cls',ov).textContent=clsCur()?clsCur().name:'';
  $('.dr-left',ov).textContent= pool.length ? `${DRAW.mode==='groups'?'المجموعات':'الحاضرات'}: ${pool.length} • لم تُسحب بعد: ${pool.length-used.length}` : '';
  $('.dr-go',ov).disabled=!pool.length;
  if(!pool.length){ $('.dr-who',ov).textContent= CLS.ok?'لا توجد أسماء':'افتحي العرض من المكتبة'; $('.dr-who',ov).className='dr-who sm'; $('.dr-full',ov).textContent=''; }
}
function openDraw(mode){
  DRAW.mode= mode==='groups'&&clsGroups().length>=2 ? 'groups' : 'names';
  const ov=$('#drawOv'); $('.dr-who',ov).textContent='؟'; $('.dr-who',ov).className='dr-who'; $('.dr-full',ov).textContent='';
  drawPaint(); ov.classList.add('open'); sound.pop();
}
function closeDraw(){ $('#drawOv').classList.remove('open'); }
function runDraw(){
  if(DRAW.busy) return; const all=drawPool(); if(!all.length) return;
  const ov=$('#drawOv'), who=$('.dr-who',ov), full=$('.dr-full',ov), list=DRAW.drawn[DRAW.mode];
  let pool=all;
  if($('.dr-norep',ov).checked){ pool=all.filter(x=>!list.includes(x.id)); if(!pool.length){ list.length=0; pool=all; } }
  const win=pool[Math.floor(Math.random()*pool.length)];
  DRAW.busy=true; $('.dr-go',ov).disabled=true; full.textContent=''; who.className='dr-who spin';
  let k=0, d=45;
  (function t(){
    who.textContent=all[Math.floor(Math.random()*all.length)].label; sound.tick();
    if(++k<26){ d*=1.1; setTimeout(t,d); }
    else { who.textContent=win.label; who.className='dr-who win'; full.textContent=win.full; list.push(win.id); DRAW.busy=false; drawPaint(); sound.success();
      const r=who.getBoundingClientRect(); confetti.burst(r.left+r.width/2,r.top+r.height/2,70); }
  })();
}
(function(){
  const ov=$('#drawOv');
  $('.dr-go',ov).onclick=runDraw; $('.dr-x',ov).onclick=closeDraw;
  ov.addEventListener('click',e=>{ if(e.target===ov) closeDraw(); });
  $$('.dr-modes button',ov).forEach(b=>b.onclick=()=>{ DRAW.mode=b.dataset.m; $('.dr-who',ov).textContent='؟'; $('.dr-who',ov).className='dr-who'; $('.dr-full',ov).textContent=''; drawPaint(); });
  $('.dr-reset',ov).onclick=()=>{ DRAW.drawn[DRAW.mode].length=0; drawPaint(); sound.pop(); };
  $('#drawBtn').onclick=()=>$('#drawOv').classList.contains('open')?closeDraw():openDraw(CLS.drawMode);
})();
$$('.hero-cls').forEach(h=>h.textContent=clsCur()?'👩‍🎓 '+clsCur().name:'');

/* ---------------- ▶️ البداية ---------------- */
go(0);
</script>
</body>
